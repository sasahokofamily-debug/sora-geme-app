<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>WebStore</title>
<link rel="stylesheet" href="./webstore.css?v=101">
</head>
<body data-no-common-nav="true">
<main class="store">
<header class="page-head"><div><p id="dateLabel" class="date"></p><h1 id="pageTitle">おすすめ</h1></div><button id="profileButton" class="profile" type="button" aria-label="アカウント">人</button></header>
<section id="todayView" class="view active">
<div class="features"><button class="feature shooting" data-open-app="shooking" type="button"><small>WEBSTORE EXCLUSIVE</small><h2>宇宙へ出撃。<br>SHOO KING II</h2><p>武器、機体、ステージを攻略するブラウザシューティング。</p><b>🚀</b></button><button class="feature study" data-open-app="guild" type="button"><small>STUDY PICK</small><h2>学びを冒険に。<br>Sora Guild</h2><p>勉強を楽しく続けるためのWebアプリ。</p><b>📚</b></button></div>
<section class="block"><div class="block-head"><div><h2>注目のアプリ</h2><p>すぐ使えるWebアプリ</p></div><button data-switch="games" type="button">すべて見る</button></div><div id="todayList"></div></section>
<section class="block"><div class="block-head"><div><h2>カテゴリ</h2><p>ジャンルから探す</p></div></div><div class="categories"><button data-category="勉強"><span>📚</span><strong>勉強</strong><small>学習・記録</small></button><button data-category="シューティング"><span>🚀</span><strong>シューティング</strong><small>宇宙・銃撃</small></button><button data-category="RPG"><span>⚔️</span><strong>RPG</strong><small>冒険と育成</small></button><button data-category="パズル"><span>🧩</span><strong>パズル</strong><small>考えて解く</small></button><button data-category="アクション"><span>🏃</span><strong>アクション</strong><small>すぐ遊べる</small></button><button data-category=""><span>•••</span><strong>すべて</strong><small>全アプリ</small></button></div></section>
</section>
<section id="gamesView" class="view"><div class="chips"><button class="active" data-filter="">すべて</button><button data-filter="勉強">勉強</button><button data-filter="シューティング">シューティング</button><button data-filter="アクション">アクション</button><button data-filter="RPG">RPG</button><button data-filter="パズル">パズル</button></div><div id="gamesList"></div></section>
<section id="libraryView" class="view"><div class="library-card"><div><h2>マイライブラリ</h2><p id="libraryMessage">認証するとゲームURLを登録できます。</p></div><button id="addGameButton" class="primary" type="button">ゲームを追加</button></div><section class="block"><div class="block-head"><div><h2>登録したゲーム</h2><p>アカウント別に保存</p></div></div><div id="libraryList"></div></section><section class="block"><div class="block-head"><div><h2>最近使った項目</h2></div></div><div id="recentList"></div></section></section>
<section id="searchView" class="view"><label class="search"><span>⌕</span><input id="searchInput" type="search" placeholder="アプリ、ジャンル、URLを検索"></label><button id="directOpenButton" class="secondary wide" type="button">URLを直接入力して開く</button><section class="block"><div class="block-head"><div><h2>検索結果</h2><p id="searchCount">すべてのアプリ</p></div></div><div id="searchList"></div></section></section>
</main>
<nav class="tabbar"><button class="active" data-tab="today"><b>★</b>おすすめ</button><button data-tab="games"><b>▦</b>ゲーム</button><button data-tab="library"><b>▣</b>ライブラリ</button><button data-tab="search"><b>⌕</b>検索</button></nav>
<div id="accountSheet" class="sheet"><section><header><h2>アカウント</h2><button data-close="accountSheet">×</button></header><div id="accountContent"></div></section></div>
<div id="addSheet" class="sheet"><section><header><h2>ゲームを追加</h2><button data-close="addSheet">×</button></header><form id="addForm"><label>ゲーム名<input id="gameName" required maxlength="60"></label><label>ジャンル<select id="gameGenre"><option>勉強</option><option>シューティング</option><option>アクション</option><option>RPG</option><option>パズル</option><option>その他</option></select></label><label>HTMLゲームURL<input id="gameUrl" type="url" required placeholder="https://example.com/game.html"></label><label>説明<textarea id="gameDescription" maxlength="180"></textarea></label><button class="primary wide">WebStoreに追加</button></form></section></div>
<div id="moreSheet" class="sheet"><section><header><h2 id="moreTitle">アプリ</h2><button data-close="moreSheet">×</button></header><button id="moreOpen" class="primary wide">開く</button><button id="moreCopy" class="secondary wide">URLをコピー</button><button id="moreDelete" class="danger wide">ライブラリから削除</button></section></div>
<div id="toast" class="toast"></div>
<script src="./webstore.js?v=101"></script>
</body>
</html>
