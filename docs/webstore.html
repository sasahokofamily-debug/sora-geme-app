<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>WebStore | HTML Games</title>
<style>
:root{color-scheme:dark;--bg:#070b16;--panel:#121a2d;--line:#2b3958;--text:#f5f7ff;--muted:#9babc7;--blue:#4d86ff;--cyan:#35dcff;--red:#ff667a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% -5%,#163b72 0,transparent 34%),radial-gradient(circle at 100% 10%,#2a2463 0,transparent 30%),var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif}.wrap{width:min(1120px,calc(100% - 24px));margin:auto}.bar{position:sticky;top:0;z-index:20;border-bottom:1px solid #ffffff14;background:#070b16df;backdrop-filter:blur(16px)}.barin{height:64px;display:flex;align-items:center;gap:10px}.mark{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(145deg,var(--cyan),var(--blue));color:#03101d;font-weight:1000}.brand{font-size:20px;font-weight:900}.actions{margin-left:auto;display:flex;gap:8px}button,input,textarea,select{font:inherit}.btn{min-height:43px;padding:9px 14px;border:1px solid var(--line);border-radius:12px;background:#18233c;color:var(--text);font-weight:800;cursor:pointer}.btn.primary{border-color:#5b8fff;background:linear-gradient(145deg,#2476ff,#6558ef)}.btn.danger{border-color:#703344;background:#3a1822;color:#ffc4cc}.hero{padding:48px 0 24px}.hero small{display:inline-block;padding:5px 9px;border:1px solid #4d86ff66;border-radius:999px;color:#a7c5ff;font-weight:900;letter-spacing:.08em}.hero h1{margin:15px 0 10px;font-size:clamp(42px,8vw,74px);line-height:1;letter-spacing:-.04em}.hero p{max-width:720px;margin:0;color:var(--muted);font-size:17px;line-height:1.75}.panel{display:none;margin:0 0 22px;padding:20px;border:1px solid var(--line);border-radius:18px;background:#11182af2}.panel.open{display:block}.panelhead{display:flex;align-items:center}.panelhead h2{margin:0}.panelhead button{margin-left:auto}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.field.full{grid-column:1/-1}.field label{display:block;margin-bottom:6px;color:#b8c7df;font-size:13px;font-weight:800}.field input,.field textarea,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#090f1e;color:var(--text);outline:none}.field textarea{min-height:82px;resize:vertical}.submitrow{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px}.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin:20px 0}.search{width:100%;height:48px;padding:0 15px;border:1px solid var(--line);border-radius:14px;background:#11182ae6;color:var(--text);outline:none}.count{display:flex;align-items:center;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:#11182ab8;color:var(--muted);font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px;padding-bottom:46px}.card{overflow:hidden;border:1px solid var(--line);border-radius:19px;background:linear-gradient(160deg,#18233c,#0c1222);box-shadow:0 18px 48px #0005}.cover{height:164px;display:grid;place-items:center;position:relative;background:linear-gradient(145deg,#0b2d50,#17477e 55%,#332c75)}.cover:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 25%,#fff 0 1px,transparent 2px),radial-gradient(circle at 76% 62%,#67ddff 0 1px,transparent 2px);background-size:46px 46px,73px 73px}.icon{position:relative;font-size:64px;filter:drop-shadow(0 12px 18px #0008)}.tag{position:absolute;left:11px;top:11px;padding:5px 8px;border:1px solid #ffffff33;border-radius:999px;background:#0007;font-size:11px;font-weight:900}.body{padding:17px}.body h2{margin:0 0 7px}.desc{min-height:46px;margin:0;color:var(--muted);font-size:14px;line-height:1.6}.url{margin:12px 0;padding:8px 9px;border-radius:9px;background:#080d18;color:#8ea2c6;font:12px/1.4 Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cardrow{display:grid;grid-template-columns:1fr auto;gap:8px}.empty{display:none;grid-column:1/-1;padding:44px;border:1px dashed #344563;border-radius:16px;color:var(--muted);text-align:center}.notice{display:none;margin-bottom:16px;padding:11px 13px;border:1px solid #276e58;border-radius:11px;background:#0b342a;color:#bffbe6}.notice.show{display:block}.notice.error{border-color:#783344;background:#391720;color:#ffc7cf}@media(max-width:880px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.actions .label{display:none}.hero{padding-top:34px}.toolbar,.form,.grid{grid-template-columns:1fr}.field.full,.submitrow{grid-column:auto}.count{min-height:40px;justify-content:center}.cardrow{grid-template-columns:1fr auto}}
</style>
</head>
<body>
<header class="bar"><div class="wrap barin"><span class="mark">W</span><span class="brand">WebStore</span><div class="actions"><button class="btn" id="direct" type="button">🔗 <span class="label">URLを開く</span></button><button class="btn primary" id="add" type="button">＋ <span class="label">ゲーム追加</span></button></div></div></header>
<main class="wrap">
<section class="hero"><small>HTML GAME STORE</small><h1>ゲームURLを、<br>ひとつの場所に。</h1><p>HTMLゲームのURLを登録・検索して、WebStoreから直接起動できます。登録した内容はこのブラウザ内だけに保存されます。</p></section>
<div class="notice" id="notice"></div>
<section class="panel" id="panel"><div class="panelhead"><h2>ゲームを追加</h2><button class="btn" id="close" type="button">×</button></div><form id="form" class="form"><div class="field"><label>ゲーム名</label><input id="name" maxlength="60" required placeholder="ゲーム名"></div><div class="field"><label>ジャンル</label><select id="genre"><option>シューティング</option><option>アクション</option><option>RPG</option><option>パズル</option><option>シミュレーション</option><option>その他</option></select></div><div class="field full"><label>HTMLゲームURL</label><input id="url" type="url" inputmode="url" required placeholder="https://example.com/game.html"></div><div class="field full"><label>説明</label><textarea id="description" maxlength="180" placeholder="ゲームの説明"></textarea></div><div class="submitrow"><button class="btn" id="cancel" type="button">キャンセル</button><button class="btn primary" type="submit">登録する</button></div></form></section>
<section class="toolbar"><input class="search" id="search" type="search" placeholder="ゲーム名・ジャンル・URLを検索"><div class="count" id="count">0 GAMES</div></section>
<section class="grid" id="grid"><div class="empty" id="empty">該当するゲームがありません。</div></section>
</main>
<script>
(()=>{'use strict';const KEY='sora_webstore_games_v1';const builtins=[{id:'shooking',name:'SHOO KING II',genre:'シューティング',description:'宇宙船、武器、機体を強化して進むブラウザシューティング。',url:new URL('./game?play=1&v=94&_pages=94&_stable=94',location.href).href,icon:'🚀',builtin:true}];const $=id=>document.getElementById(id);const grid=$('grid'),empty=$('empty'),panel=$('panel'),form=$('form'),notice=$('notice'),search=$('search'),count=$('count');let custom=load();function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(v)?v:[]}catch{return[]}}function save(){try{localStorage.setItem(KEY,JSON.stringify(custom))}catch{flash('保存できませんでした。',true)}}function valid(v){try{const u=new URL(String(v).trim());return /^https?:$/.test(u.protocol)?u.href:''}catch{return''}}function flash(text,error=false){notice.textContent=text;notice.className='notice show'+(error?' error':'');clearTimeout(flash.t);flash.t=setTimeout(()=>notice.className='notice',3000)}function openGame(url){const w=window.open(url,'_blank','noopener,noreferrer');if(!w)location.href=url}function make(game){const card=document.createElement('article');card.className='card';const cover=document.createElement('div');cover.className='cover';const tag=document.createElement('span');tag.className='tag';tag.textContent=game.builtin?'OFFICIAL':game.genre;const icon=document.createElement('span');icon.className='icon';icon.textContent=game.icon||'🎮';cover.append(tag,icon);const body=document.createElement('div');body.className='body';const h=document.createElement('h2');h.textContent=game.name;const p=document.createElement('p');p.className='desc';p.textContent=game.description||'HTMLゲームへのリンクです。';const u=document.createElement('div');u.className='url';u.textContent=game.url;u.title=game.url;const row=document.createElement('div');row.className='cardrow';const play=document.createElement('button');play.className='btn primary';play.type='button';play.textContent='プレイする';play.onclick=()=>openGame(game.url);row.append(play);if(!game.builtin){const del=document.createElement('button');del.className='btn danger';del.type='button';del.textContent='削除';del.onclick=()=>{if(!confirm('「'+game.name+'」を削除しますか？'))return;custom=custom.filter(x=>x.id!==game.id);save();render()};row.append(del)}body.append(h,p,u,row);card.append(cover,body);return card}function render(){const q=search.value.trim().toLowerCase();const list=[...builtins,...custom].filter(g=>[g.name,g.genre,g.description,g.url].join(' ').toLowerCase().includes(q));grid.querySelectorAll('.card').forEach(x=>x.remove());list.forEach(g=>grid.insertBefore(make(g),empty));empty.style.display=list.length?'none':'block';count.textContent=list.length+' GAME'+(list.length===1?'':'S')}function hide(){panel.classList.remove('open');form.reset()}$('add').onclick=()=>{panel.classList.add('open');$('name').focus()};$('close').onclick=hide;$('cancel').onclick=hide;$('direct').onclick=()=>{const value=prompt('開きたいHTMLゲームURLを入力してください。','https://');if(value===null)return;const url=valid(value);if(!url){flash('http:// または https:// のURLを入力してください。',true);return}openGame(url)};search.oninput=render;form.onsubmit=e=>{e.preventDefault();const name=$('name').value.trim(),url=valid($('url').value);if(!name||!url){flash('ゲーム名と正しいURLを入力してください。',true);return}custom.unshift({id:'g'+Date.now(),name,genre:$('genre').value,description:$('description').value.trim(),url,icon:'🎮'});save();hide();render();flash('WebStoreへ登録しました。')};render()})();
</script>
</body>
</html>
