<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0078d4">
<title>SHOO KING II</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0078d4;color:#fff;font-family:"Segoe UI",system-ui,sans-serif}
body{display:grid;place-items:center;text-align:center}
.wrap{display:flex;flex-direction:column;align-items:center;transform:translateY(-2vh)}
.spinner{position:relative;width:62px;height:62px;margin-bottom:22px;animation:spin 1s linear infinite}
.spinner i{position:absolute;left:27px;top:2px;width:8px;height:8px;border-radius:50%;background:#fff;transform-origin:4px 29px}
.spinner i:nth-child(1){transform:rotate(0deg);opacity:1}.spinner i:nth-child(2){transform:rotate(45deg);opacity:.86}.spinner i:nth-child(3){transform:rotate(90deg);opacity:.72}.spinner i:nth-child(4){transform:rotate(135deg);opacity:.58}.spinner i:nth-child(5){transform:rotate(180deg);opacity:.46}.spinner i:nth-child(6){transform:rotate(225deg);opacity:.34}.spinner i:nth-child(7){transform:rotate(270deg);opacity:.24}.spinner i:nth-child(8){transform:rotate(315deg);opacity:.14}
#msg{font-size:22px;line-height:1.4}.sub{margin-top:10px;font-size:12px;opacity:.76}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<script>
(() => {
  const destination = new URL('./game', location.href);
  destination.searchParams.set('play', '1');
  destination.searchParams.set('v', '92');

  async function start() {
    const msg = document.getElementById('msg');
    if (!('serviceWorker' in navigator)) {
      location.replace(destination.href);
      return;
    }
    try {
      const registration = await navigator.serviceWorker.register('./sw.js?v=92', { scope: './' });
      await registration.update().catch(() => {});
      await navigator.serviceWorker.ready;
      if (!navigator.serviceWorker.controller) {
        await new Promise(resolve => {
          const timer = setTimeout(resolve, 650);
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            clearTimeout(timer);
            resolve();
          }, { once: true });
        });
      }
      location.replace(destination.href);
    } catch (error) {
      console.error(error);
      if (msg) msg.textContent = '起動方法を切り替えています...';
      setTimeout(() => location.replace(destination.href), 120);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start, { once: true });
  } else {
    start();
  }
})();
</script>
</head>
<body>
<div class="wrap">
  <div class="spinner" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div id="msg">起動中...</div>
  <div class="sub">公開版を準備しています</div>
</div>
</body>
</html>
