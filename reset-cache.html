<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>SHOO KING II キャッシュ更新</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#020617;color:#e5f8ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(560px,94vw);border:1px solid rgba(125,249,255,.55);border-radius:22px;background:linear-gradient(180deg,rgba(15,23,42,.92),rgba(2,6,23,.96));padding:24px;box-shadow:0 0 36px rgba(56,189,248,.2)}h1{margin:0 0 8px;color:#7df9ff;font-size:28px}.small{color:#b6c9d8;line-height:1.7}.status{margin:16px 0;padding:12px;border:1px solid rgba(56,189,248,.4);border-radius:14px;background:rgba(14,165,233,.1);white-space:pre-wrap;line-height:1.6}button,a{display:block;width:100%;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:13px 16px;margin-top:10px;background:#1f8cff;color:white;font-weight:900;font-size:16px;cursor:pointer}.ghost{background:#334155}</style>
</head>
<body>
<main class="card">
  <h1>キャッシュ更新中</h1>
  <p class="small">古い読み込み画面・古いService Worker・古いキャッシュを削除して、軽いホーム画面を新しい状態で開き直します。</p>
  <div id="status" class="status">準備中...</div>
  <button id="run" type="button">もう一度キャッシュ更新</button>
  <a class="ghost" id="openHome" href="./?v=104-home-fast-light">ホームを開く</a>
  <a class="ghost" id="openGame" href="./?play=1&v=104-home-fast-light">ゲーム本体を開く</a>
</main>
<script>
(()=>{
  const status=document.getElementById('status');
  const log=[];
  function say(text){log.push(text);status.textContent=log.join('\n')}
  async function clearEverything(){
    log.length=0;
    say('1/4 キャッシュを確認しています...');
    try{
      if('caches' in window){
        const keys=await caches.keys();
        await Promise.all(keys.map(key=>caches.delete(key)));
        say(`2/4 Cache Storageを削除しました: ${keys.length}件`);
      }else{
        say('2/4 Cache Storageは未対応です');
      }
    }catch(e){say('2/4 Cache Storage削除でエラー: '+e.message)}

    try{
      if('serviceWorker' in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(reg=>reg.unregister()));
        say(`3/4 Service Workerを解除しました: ${regs.length}件`);
      }else{
        say('3/4 Service Workerは未対応です');
      }
    }catch(e){say('3/4 Service Worker解除でエラー: '+e.message)}

    try{localStorage.setItem('shooking2_cache_reset_at',String(Date.now()))}catch(e){}
    const next=new URL('./',location.href);
    next.searchParams.set('v','104-home-fast-light-'+Date.now());
    say('4/4 軽いホーム画面で開き直します...');
    setTimeout(()=>location.replace(next.href),650);
  }
  document.getElementById('run').addEventListener('click',clearEverything);
  clearEverything();
})();
</script>
</body>
</html>
