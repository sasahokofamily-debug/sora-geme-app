<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>SORA RACING VR</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}.hidden{display:none!important}.panel{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 50% 25%,#164e63,#020617 72%)}.card{width:min(660px,94vw);max-height:92vh;overflow:auto;padding:24px;border:1px solid #38bdf8;border-radius:22px;background:rgba(2,6,23,.95);box-shadow:0 20px 70px #000;text-align:center}h1{margin:0;font-size:clamp(34px,9vw,64px);color:#67e8f9;text-shadow:0 0 22px #06b6d4}.sub{margin:8px 0 18px;color:#bae6fd;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.mode,.settingChoice{padding:14px;border:1px solid #334155;border-radius:15px;background:#0f172a;color:#fff;cursor:pointer}.mode.selected,.settingChoice.selected{border-color:#facc15;box-shadow:0 0 18px #facc1555}.mode strong,.settingChoice strong{display:block;font-size:17px}.mode span,.settingChoice span{display:block;margin-top:5px;font-size:12px;color:#cbd5e1;line-height:1.45}.sectionTitle{margin:20px 0 9px;text-align:left;color:#fde68a;font-weight:900}button,a.button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin-top:12px;padding:12px;border:0;border-radius:13px;background:#0284c7;color:#fff;text-decoration:none;font-weight:900;font-size:16px;cursor:pointer}.secondary{background:#334155!important}.danger{background:#dc2626!important}.warning{margin-top:14px;padding:10px;border-radius:12px;background:#422006;color:#fde68a;font-size:12px;line-height:1.6}.hud{position:fixed;z-index:4;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));padding:10px 13px;border:1px solid #38bdf8;border-radius:13px;background:#020617c9;font-weight:800;font-size:13px;line-height:1.5}.hud b{color:#67e8f9}.rightHud{left:auto;right:max(10px,env(safe-area-inset-right));text-align:right}.centerMsg{position:fixed;z-index:8;left:50%;top:25%;transform:translate(-50%,-50%);font-size:clamp(32px,12vw,88px);font-weight:1000;text-shadow:0 4px 25px #000;pointer-events:none;text-align:center;white-space:nowrap}.controls{position:fixed;inset:0;z-index:5;pointer-events:none}.pedal,.steer{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));border:2px solid #ffffff88;background:#0f172aaa;color:#fff;pointer-events:auto;touch-action:none;user-select:none}.steer{left:max(18px,env(safe-area-inset-left));width:132px;height:132px;border-radius:50%;display:grid;place-items:center;font-size:44px}.pedal{right:max(18px,env(safe-area-inset-right));width:96px;height:132px;border-radius:22px;font-size:16px;font-weight:900}.brake{right:126px;height:92px;background:#7f1d1dcc}.exit{position:fixed;z-index:7;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:8px 12px;border:1px solid #fff5;border-radius:999px;background:#020617bb;color:#fff;text-decoration:none;font-size:12px;font-weight:900}.settingsBtn{position:fixed;z-index:9;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));width:54px!important;height:54px;min-height:54px!important;margin:0!important;border-radius:50%!important;font-size:24px!important;background:#334155dd!important}.gameover{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:18px;background:rgba(0,0,0,.78);backdrop-filter:blur(6px)}.gameover .card{border-color:#ef4444}.gameover h2{font-size:clamp(42px,12vw,82px);margin:0;color:#f87171;text-shadow:0 0 24px #ef4444}.status{margin:8px 0;padding:8px;border-radius:10px;background:#082f49;color:#bae6fd;font-size:13px;font-weight:800}.shake{animation:shake .35s linear}@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-12px,5px)}50%{transform:translate(10px,-6px)}75%{transform:translate(-7px,4px)}}@media(max-width:600px){.card{padding:17px}.grid{grid-template-columns:1fr}.hud{font-size:11px}.steer{width:118px;height:118px}.pedal{width:82px;height:118px}.brake{right:110px;height:80px}.rightHud{top:72px}.settingsBtn{bottom:150px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<a class="exit" href="./">← SHOO KING II</a>
<div id="hud" class="hud hidden">速度 <b id="speed">0</b> km/h<br>順位 <b id="place">1 / 6</b></div>
<div id="lapHud" class="hud rightHud hidden">LAP <b id="lap">1 / 3</b><br>TIME <b id="time">0.0</b></div>
<div id="msg" class="centerMsg"></div>
<div id="touch" class="controls hidden"><div id="steer" class="steer">↔</div><button id="brake" class="pedal brake">BRAKE</button><button id="gas" class="pedal">GAS</button></div>
<button id="settingsBtn" class="settingsBtn hidden" aria-label="設定">⚙️</button>
<div id="menu" class="panel"><div class="card"><h1>SORA RACING</h1><div class="sub">VR / スマホ / PC対応</div><div class="sectionTitle">コース</div><div class="grid"><div class="mode selected" data-mode="city"><strong>🌃 CITY</strong><span>夜の高速道路</span></div><div class="mode" data-mode="desert"><strong>🏜 DESERT</strong><span>砂漠の高速コース</span></div><div class="mode" data-mode="snow"><strong>❄ SNOW</strong><span>滑りやすい雪道</span></div><div class="mode" data-mode="neon"><strong>🌈 NEON</strong><span>未来都市の超高速</span></div></div><div class="sectionTitle">スマホ操作設定</div><div id="menuControls" class="grid"></div><div id="menuStatus" class="status"></div><button id="start">🔊 音ありでレース開始</button><a class="button secondary" href="./">SHOO KING IIへ戻る</a><div class="warning">設定は自動保存され、次回も同じ操作方法になります。</div></div></div>
<div id="settings" class="panel hidden"><div class="card"><h2>⚙️ 操作設定</h2><div class="sectionTitle">スマホ操作</div><div id="settingsControls" class="grid"></div><div id="settingsStatus" class="status"></div><button id="applySettings">設定を保存して戻る</button><button id="closeSettings" class="secondary">変更せず戻る</button></div></div>
<div id="gameover" class="gameover hidden"><div class="card"><h2>GAME OVER</h2><p id="reason">コースから落下しました</p><button id="retry" class="danger">もう一度</button><button id="backMenu" class="secondary">コース選択へ戻る</button></div></div>
<script>
(()=>{'use strict';
const c=document.getElementById('game'),x=c.getContext('2d'),$=id=>document.getElementById(id);let W=0,H=0,DPR=1;
const menu=$('menu'),settings=$('settings'),hud=$('hud'),lapHud=$('lapHud'),touch=$('touch'),msg=$('msg'),speedEl=$('speed'),placeEl=$('place'),lapEl=$('lap'),timeEl=$('time'),gameover=$('gameover'),settingsBtn=$('settingsBtn');
let mode='city',running=false,last=0,speed=0,roadPos=0,playerX=0,steer=0,gas=false,brake=false,tilt=0,lap=1,startTime=0,finish=false,spin=0,fall=0,orientationBound=false;
let controlMode=localStorage.getItem('soraRacingControlMode')||'buttons',draftControlMode=controlMode;
const keys={},themes={city:{sky:'#071b36',ground:'#101827',road:'#263442',edge:'#e2e8f0',stripe:'#facc15'},desert:{sky:'#7c2d12',ground:'#b45309',road:'#3f3f46',edge:'#fef3c7',stripe:'#fff7ed'},snow:{sky:'#334155',ground:'#e2e8f0',road:'#64748b',edge:'#fff',stripe:'#bfdbfe'},neon:{sky:'#13052f',ground:'#090016',road:'#17102b',edge:'#22d3ee',stripe:'#f0abfc'}};
const cars=Array.from({length:5},(_,i)=>({z:450+i*360,x:(i%2?.55:-.55)*(0.4+Math.random()*.5),color:['#ef4444','#22c55e','#f59e0b','#a855f7','#e2e8f0'][i],speed:115+Math.random()*80}));
const obstacleTypes=['cone','oil','banana','crate','boost'];let obstacles=[];let audio=null,engineOsc=null,engineGain=null;
function initAudio(){if(audio)return;audio=new(window.AudioContext||window.webkitAudioContext)();engineOsc=audio.createOscillator();engineGain=audio.createGain();engineOsc.type='sawtooth';engineGain.gain.value=0;engineOsc.connect(engineGain).connect(audio.destination);engineOsc.start()}
function tone(freq=440,dur=.12,type='square',vol=.12,slide=0){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),audio.currentTime+dur);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}
function noise(dur=.25,vol=.15){if(!audio)return;const b=audio.createBuffer(1,audio.sampleRate*dur,audio.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=audio.createBufferSource(),g=audio.createGain();s.buffer=b;g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);s.connect(g).connect(audio.destination);s.start()}
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;x.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const controlOptions=[['buttons','🎮 画面ボタン','ハンドル・GAS・BRAKEを表示'],['tilt','📱 傾き＋ボタン','傾きでハンドル、GAS・BRAKEは画面'],['auto','⚡ 自動加速','左右操作だけで自動的に加速']];
function controlName(v){return controlOptions.find(o=>o[0]===v)?.[1]||v}
function renderControlChoices(targetId,selected){const el=$(targetId);el.innerHTML=controlOptions.map(o=>`<div class="settingChoice ${o[0]===selected?'selected':''}" data-control="${o[0]}"><strong>${o[1]}</strong><span>${o[2]}</span></div>`).join('');el.querySelectorAll('.settingChoice').forEach(v=>v.onclick=()=>{draftControlMode=v.dataset.control;renderControlChoices(targetId,draftControlMode);updateStatus()})}
function updateStatus(){$('menuStatus').textContent='現在：'+controlName(controlMode);$('settingsStatus').textContent='選択中：'+controlName(draftControlMode)}
function saveControlMode(){controlMode=draftControlMode;localStorage.setItem('soraRacingControlMode',controlMode);updateStatus();applyTouchLayout()}
function applyTouchLayout(){if(!matchMedia('(pointer:coarse)').matches||!running){touch.classList.add('hidden');return}touch.classList.remove('hidden');$('gas').classList.toggle('hidden',controlMode==='auto');$('brake').classList.remove('hidden');$('steer').classList.toggle('hidden',controlMode==='tilt')}
async function enableTilt(){try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){const p=await DeviceOrientationEvent.requestPermission();if(p!=='granted')throw new Error('denied')}if(!orientationBound){addEventListener('deviceorientation',e=>tilt=Math.max(-1,Math.min(1,(e.gamma||0)/28)));orientationBound=true}return true}catch(e){draftControlMode='buttons';controlMode='buttons';localStorage.setItem('soraRacingControlMode','buttons');updateStatus();alert('傾き操作を許可できなかったので、画面ボタンに戻しました。');return false}}
renderControlChoices('menuControls',controlMode);renderControlChoices('settingsControls',draftControlMode);updateStatus();
document.querySelectorAll('.mode').forEach(el=>el.onclick=()=>{document.querySelectorAll('.mode').forEach(v=>v.classList.remove('selected'));el.classList.add('selected');mode=el.dataset.mode;tone(520,.08,'sine',.08)});
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function hold(el,on,off){['pointerdown','touchstart'].forEach(n=>el.addEventListener(n,e=>{e.preventDefault();on()}));['pointerup','pointercancel','pointerleave','touchend'].forEach(n=>el.addEventListener(n,e=>{e.preventDefault();off()}))}hold($('gas'),()=>gas=true,()=>gas=false);hold($('brake'),()=>brake=true,()=>brake=false);
let steerPointer=null;$('steer').addEventListener('pointerdown',e=>{steerPointer=e.pointerId;$('steer').setPointerCapture(e.pointerId)});$('steer').addEventListener('pointermove',e=>{if(e.pointerId!==steerPointer)return;const r=$('steer').getBoundingClientRect();steer=Math.max(-1,Math.min(1,(e.clientX-r.left-r.width/2)/(r.width*.4)))});$('steer').addEventListener('pointerup',()=>{steerPointer=null;steer=0});
settingsBtn.onclick=()=>{draftControlMode=controlMode;renderControlChoices('settingsControls',draftControlMode);updateStatus();settings.classList.remove('hidden');running=false};
$('closeSettings').onclick=()=>{settings.classList.add('hidden');running=true;last=performance.now()};
$('applySettings').onclick=async()=>{if(draftControlMode==='tilt'&&!(await enableTilt())){renderControlChoices('settingsControls',draftControlMode);return}saveControlMode();settings.classList.add('hidden');running=true;last=performance.now()};
function makeObstacles(){obstacles=[];for(let i=0;i<28;i++)obstacles.push({z:650+i*240+Math.random()*150,x:Math.random()*1.5-.75,type:obstacleTypes[i%obstacleTypes.length],hit:false})}
async function startRace(){initAudio();if(audio.state==='suspended')await audio.resume();draftControlMode=controlMode;if(controlMode==='tilt'&&!(await enableTilt()))controlMode='buttons';menu.classList.add('hidden');gameover.classList.add('hidden');hud.classList.remove('hidden');lapHud.classList.remove('hidden');settingsBtn.classList.remove('hidden');running=true;finish=false;speed=0;roadPos=0;playerX=0;lap=1;spin=0;fall=0;startTime=performance.now();cars.forEach((a,i)=>a.z=500+i*380);makeObstacles();applyTouchLayout();for(let n=3;n>0;n--){msg.textContent=n;tone(420+n*80,.13,'square',.12);await new Promise(r=>setTimeout(r,650))}msg.textContent='GO!';tone(880,.4,'sawtooth',.16,500);setTimeout(()=>msg.textContent='',700)}
$('start').onclick=()=>{controlMode=draftControlMode;localStorage.setItem('soraRacingControlMode',controlMode);startRace()};$('retry').onclick=startRace;$('backMenu').onclick=()=>{gameover.classList.add('hidden');menu.classList.remove('hidden');hud.classList.add('hidden');lapHud.classList.add('hidden');touch.classList.add('hidden');settingsBtn.classList.add('hidden');msg.textContent='';renderControlChoices('menuControls',controlMode);updateStatus()};
function endGame(reason){if(!running)return;running=false;finish=true;speed=0;touch.classList.add('hidden');settingsBtn.classList.add('hidden');if(engineGain&&audio)engineGain.gain.setTargetAtTime(0,audio.currentTime,.05);noise(.55,.26);tone(180,.8,'sawtooth',.18,-120);document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),400);$('reason').textContent=reason;msg.textContent='GAME OVER';setTimeout(()=>{msg.textContent='';gameover.classList.remove('hidden')},900)}
function curveAt(z){return Math.sin((roadPos+z)/900)*.75+Math.sin((roadPos+z)/2400)*.9}
function hitObstacle(o){if(o.hit)return;o.hit=true;if(o.type==='boost'){speed=Math.min(speed+85,360);tone(720,.35,'sawtooth',.18,900);msg.textContent='BOOST!'}else if(o.type==='oil'||o.type==='banana'){spin=1.25;speed*=.62;tone(260,.45,'sine',.16,-160);msg.textContent='SPIN!'}else if(o.type==='crate'){speed*=.35;noise(.3,.25);tone(90,.3,'square',.2);msg.textContent='CRASH!'}else{speed*=.55;tone(140,.22,'square',.18);msg.textContent='HIT!'}setTimeout(()=>msg.textContent='',500)}
function update(dt){if(!running||finish)return;const auto=controlMode==='auto',accel=(auto||gas||keys.arrowup||keys.w)?78:0,dec=(brake||keys.arrowdown||keys.s)?135:(auto?5:18);speed+=accel*dt-dec*dt;const max=mode==='neon'?330:mode==='snow'?220:280;speed=Math.max(0,Math.min(max,speed));let input=(keys.arrowleft||keys.a?-1:0)+(keys.arrowright||keys.d?1:0);if(controlMode==='tilt'&&Math.abs(tilt)>.08)input=tilt;else if(Math.abs(steer)>.03)input=steer;if(spin>0){spin-=dt;input+=Math.sin(performance.now()*.018)*1.7}const grip=mode==='snow'?.68:1;playerX+=input*dt*(1.1+speed/125)*grip;playerX-=curveAt(90)*dt*speed/215;if(Math.abs(playerX)>1.12){speed-=95*dt;fall+=dt*(Math.abs(playerX)>1.28?1.9:.55)}else fall=Math.max(0,fall-dt*1.5);if(Math.abs(playerX)>1.52||fall>1.15){endGame('コースから落下しました');return}roadPos+=speed*dt*2.15;cars.forEach(car=>{car.z+=(car.speed-speed)*dt*2.15;if(car.z<-80)car.z+=2100;if(car.z>2200)car.z-=2100;if(car.z<150&&car.z>-15&&Math.abs(playerX-car.x)<.25){speed*=.72;car.z+=100;noise(.12,.1)}});obstacles.forEach(o=>{o.z-=speed*dt*2.15;if(o.z<-100){o.z+=6900;o.hit=false}if(o.z<125&&o.z>5&&Math.abs(playerX-o.x)<.24)hitObstacle(o)});if(roadPos>5200*lap){lap++;if(lap>3){finish=true;running=false;touch.classList.add('hidden');settingsBtn.classList.add('hidden');msg.textContent='FINISH!';tone(660,.8,'sine',.18,500);setTimeout(()=>{msg.textContent='';menu.classList.remove('hidden');hud.classList.add('hidden');lapHud.classList.add('hidden')},2600)}}if(engineGain&&audio){engineGain.gain.setTargetAtTime(running?.035:0,audio.currentTime,.08);engineOsc.frequency.setTargetAtTime(55+speed*1.35,audio.currentTime,.06)}speedEl.textContent=Math.round(speed);lapEl.textContent=Math.min(lap,3)+' / 3';timeEl.textContent=((performance.now()-startTime)/1000).toFixed(1);placeEl.textContent=(1+cars.filter(a=>a.z>0&&a.z<900).length)+' / 6'}
function project(z,lane){const horizon=H*.34,p=Math.max(.001,1-z/1500),y=horizon+(H-horizon)*p*p,roadHalf=W*(.06+.5*p),center=W/2+curveAt(z)*W*.18*p-playerX*roadHalf*.78;return{x:center+lane*roadHalf,y,scale:p,roadHalf}}
function drawObstacle(o){if(o.z<18||o.z>1450)return;const p=project(o.z,o.x),s=Math.max(8,52*p.scale);x.save();x.translate(p.x,p.y);if(o.type==='cone'){x.fillStyle='#f97316';x.beginPath();x.moveTo(0,-s);x.lineTo(-s*.45,0);x.lineTo(s*.45,0);x.fill();x.fillStyle='#fff';x.fillRect(-s*.27,-s*.43,s*.54,s*.13)}else if(o.type==='oil'){x.fillStyle='#050505';x.beginPath();x.ellipse(0,-s*.1,s*.6,s*.2,0,0,Math.PI*2);x.fill()}else if(o.type==='banana'){x.font=`${s}px serif`;x.textAlign='center';x.fillText('🍌',0,0)}else if(o.type==='crate'){x.fillStyle='#92400e';x.fillRect(-s*.45,-s*.9,s*.9,s*.9);x.strokeStyle='#fbbf24';x.lineWidth=Math.max(2,s*.08);x.strokeRect(-s*.45,-s*.9,s*.9,s*.9)}else{x.fillStyle='#22d3ee';x.fillRect(-s*.7,-s*.18,s*1.4,s*.25);x.fillStyle='#fff';x.font=`${s*.55}px system-ui`;x.textAlign='center';x.fillText('≫',0,s*.05)}x.restore()}
function draw(){const t=themes[mode],h=H*.34;x.fillStyle=t.sky;x.fillRect(0,0,W,H);const g=x.createLinearGradient(0,h,0,H);g.addColorStop(0,t.ground);g.addColorStop(1,'#020617');x.fillStyle=g;x.fillRect(0,h,W,H-h);for(let z=1500;z>0;z-=45){const a=project(z,0),b=project(z-45,0),la=project(z,-1),ra=project(z,1),lb=project(z-45,-1),rb=project(z-45,1);x.fillStyle=Math.floor((roadPos+z)/90)%2?t.edge:'#ef4444';x.beginPath();x.moveTo(la.x-a.roadHalf*.08,la.y);x.lineTo(lb.x-b.roadHalf*.08,lb.y);x.lineTo(lb.x,lb.y);x.lineTo(la.x,la.y);x.fill();x.beginPath();x.moveTo(ra.x+a.roadHalf*.08,ra.y);x.lineTo(rb.x+b.roadHalf*.08,rb.y);x.lineTo(rb.x,rb.y);x.lineTo(ra.x,ra.y);x.fill();x.fillStyle=t.road;x.beginPath();x.moveTo(la.x,la.y);x.lineTo(lb.x,lb.y);x.lineTo(rb.x,rb.y);x.lineTo(ra.x,ra.y);x.fill()}obstacles.slice().sort((a,b)=>b.z-a.z).forEach(drawObstacle);cars.slice().sort((a,b)=>b.z-a.z).forEach(car=>{if(car.z<20||car.z>1450)return;const p=project(car.z,car.x),w=62*p.scale,h2=38*p.scale;x.fillStyle=car.color;x.fillRect(p.x-w/2,p.y-h2,w,h2);x.fillStyle='#111827';x.fillRect(p.x-w*.32,p.y-h2*.82,w*.64,h2*.34)});const carY=H*.86+Math.min(120,fall*180),carW=Math.min(220,W*.34),carH=72;x.save();x.translate(W/2,carY);x.rotate(-steer*.08+(spin>0?Math.sin(performance.now()*.025)*.3:0));x.fillStyle='#0ea5e9';x.beginPath();x.roundRect(-carW/2,-carH/2,carW,carH,22);x.fill();x.fillStyle='#082f49';x.fillRect(-carW*.28,-carH*.42,carW*.56,carH*.25);x.fillStyle='#ef4444';x.fillRect(-carW*.43,carH*.22,carW*.18,8);x.fillRect(carW*.25,carH*.22,carW*.18,8);x.restore()}
function loop(now){const dt=Math.min(.04,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script>
</body>
</html>
