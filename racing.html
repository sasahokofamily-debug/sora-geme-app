<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>SORA RACING VR</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}.panel{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 50% 25%,#164e63,#020617 72%)}.card{width:min(620px,94vw);max-height:92vh;overflow:auto;padding:24px;border:1px solid #38bdf8;border-radius:22px;background:rgba(2,6,23,.9);box-shadow:0 20px 70px #000;text-align:center}.hidden{display:none!important}h1{margin:0;font-size:clamp(34px,9vw,64px);letter-spacing:.06em;color:#67e8f9;text-shadow:0 0 22px #06b6d4}.sub{margin:8px 0 20px;color:#bae6fd;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.mode{padding:16px;border:1px solid #334155;border-radius:16px;background:#0f172a;color:#fff;cursor:pointer}.mode.selected{border-color:#facc15;box-shadow:0 0 18px #facc1555}.mode strong{display:block;font-size:18px}.mode span{display:block;margin-top:6px;font-size:12px;color:#cbd5e1;line-height:1.5}button,a.button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin-top:12px;padding:12px;border:0;border-radius:13px;background:#0284c7;color:#fff;text-decoration:none;font-weight:900;font-size:16px;cursor:pointer}.secondary{background:#334155!important}.warning{margin-top:14px;padding:10px;border-radius:12px;background:#422006;color:#fde68a;font-size:12px;line-height:1.6}.hud{position:fixed;z-index:4;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));padding:10px 13px;border:1px solid #38bdf8;border-radius:13px;background:#020617b8;font-weight:800;font-size:13px;line-height:1.5}.hud b{color:#67e8f9}.rightHud{left:auto;right:max(10px,env(safe-area-inset-right));text-align:right}.centerMsg{position:fixed;z-index:5;left:50%;top:24%;transform:translate(-50%,-50%);font-size:clamp(32px,12vw,88px);font-weight:1000;text-shadow:0 4px 25px #000;pointer-events:none}.controls{position:fixed;inset:0;z-index:5;pointer-events:none}.pedal,.steer{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));border:2px solid #ffffff88;background:#0f172a99;color:#fff;pointer-events:auto;touch-action:none;user-select:none}.steer{left:max(18px,env(safe-area-inset-left));width:132px;height:132px;border-radius:50%;display:grid;place-items:center;font-size:44px}.pedal{right:max(18px,env(safe-area-inset-right));width:96px;height:132px;border-radius:22px;font-size:16px;font-weight:900}.brake{right:126px;height:92px;bottom:max(20px,env(safe-area-inset-bottom));background:#7f1d1d99}.vrBtn{position:fixed;z-index:6;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);width:auto!important;min-width:150px;margin:0!important;padding:10px 16px!important;background:#7c3aed!important}.exit{position:fixed;z-index:7;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:8px 12px;border:1px solid #fff5;border-radius:999px;background:#020617bb;color:#fff;text-decoration:none;font-size:12px;font-weight:900}@media(max-width:600px){.card{padding:18px}.grid{grid-template-columns:1fr}.hud{font-size:11px}.steer{width:118px;height:118px}.pedal{width:82px;height:118px}.brake{right:110px;height:80px}.vrBtn{bottom:152px}.rightHud{top:72px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<a class="exit" href="./">← SHOO KING II</a>
<div id="hud" class="hud hidden">速度 <b id="speed">0</b> km/h<br>順位 <b id="place">1 / 6</b></div>
<div id="lapHud" class="hud rightHud hidden">LAP <b id="lap">1 / 3</b><br>TIME <b id="time">0.0</b></div>
<div id="msg" class="centerMsg"></div>
<div id="touch" class="controls hidden"><div id="steer" class="steer">↔</div><button id="brake" class="pedal brake">BRAKE</button><button id="gas" class="pedal">GAS</button></div>
<button id="vrButton" class="vrBtn hidden">🥽 VRモード</button>
<div id="menu" class="panel"><div class="card"><h1>SORA RACING</h1><div class="sub">VR / スマホ傾き / PC対応</div><div class="grid"><div class="mode selected" data-mode="city"><strong>🌃 CITY</strong><span>夜の高速道路。カーブはゆるめ。</span></div><div class="mode" data-mode="desert"><strong>🏜 DESERT</strong><span>砂漠コース。高速向け。</span></div><div class="mode" data-mode="snow"><strong>❄ SNOW</strong><span>滑りやすく、操作が難しい。</span></div><div class="mode" data-mode="neon"><strong>🌈 NEON</strong><span>未来都市の超高速レース。</span></div></div><button id="start">レース開始</button><button id="tilt" class="secondary">📱 スマホ傾き操作を許可</button><a class="button secondary" href="./">SHOO KING IIへ戻る</a><div class="warning">PC: ← → または A D でハンドル、↑ / Wで加速、↓ / Sでブレーキ。スマホは画面ボタンか端末の傾きで操作できます。VRは対応ブラウザ・HTTPS環境で表示されます。</div></div></div>
<script>
(()=>{'use strict';
const c=document.getElementById('game'),x=c.getContext('2d');let W=0,H=0,DPR=1;
const $=id=>document.getElementById(id);const menu=$('menu'),hud=$('hud'),lapHud=$('lapHud'),touch=$('touch'),msg=$('msg'),speedEl=$('speed'),placeEl=$('place'),lapEl=$('lap'),timeEl=$('time'),vrButton=$('vrButton');
let mode='city',running=false,last=0,speed=0,roadPos=0,playerX=0,steer=0,gas=false,brake=false,tilt=0,lap=1,startTime=0,finish=false;
const keys={};
const themes={city:{sky:'#071b36',ground:'#101827',road:'#263442',edge:'#e2e8f0',stripe:'#facc15',fog:'#38bdf8'},desert:{sky:'#7c2d12',ground:'#b45309',road:'#3f3f46',edge:'#fef3c7',stripe:'#fff7ed',fog:'#fb923c'},snow:{sky:'#334155',ground:'#e2e8f0',road:'#64748b',edge:'#fff',stripe:'#bfdbfe',fog:'#dbeafe'},neon:{sky:'#13052f',ground:'#090016',road:'#17102b',edge:'#22d3ee',stripe:'#f0abfc',fog:'#a855f7'}};
const cars=Array.from({length:5},(_,i)=>({z:450+i*360,x:(i%2?.55:-.55)*(0.4+Math.random()*.5),color:['#ef4444','#22c55e','#f59e0b','#a855f7','#e2e8f0'][i],speed:115+Math.random()*80}));
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;x.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
document.querySelectorAll('.mode').forEach(el=>el.onclick=()=>{document.querySelectorAll('.mode').forEach(v=>v.classList.remove('selected'));el.classList.add('selected');mode=el.dataset.mode});
$('tilt').onclick=async()=>{try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function')await DeviceOrientationEvent.requestPermission();addEventListener('deviceorientation',e=>{tilt=Math.max(-1,Math.min(1,(e.gamma||0)/28))});$('tilt').textContent='✅ 傾き操作ON'}catch(e){$('tilt').textContent='傾き操作を許可できませんでした'}};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function hold(el,on,off){['pointerdown','touchstart'].forEach(n=>el.addEventListener(n,e=>{e.preventDefault();on()}));['pointerup','pointercancel','pointerleave','touchend'].forEach(n=>el.addEventListener(n,e=>{e.preventDefault();off()}))}hold($('gas'),()=>gas=true,()=>gas=false);hold($('brake'),()=>brake=true,()=>brake=false);
let steerPointer=null;$('steer').addEventListener('pointerdown',e=>{steerPointer=e.pointerId;$('steer').setPointerCapture(e.pointerId)});$('steer').addEventListener('pointermove',e=>{if(e.pointerId!==steerPointer)return;const r=$('steer').getBoundingClientRect();steer=Math.max(-1,Math.min(1,(e.clientX-(r.left+r.width/2))/(r.width*.4)))});$('steer').addEventListener('pointerup',()=>{steerPointer=null;steer=0});
$('start').onclick=async()=>{menu.classList.add('hidden');hud.classList.remove('hidden');lapHud.classList.remove('hidden');if(matchMedia('(pointer:coarse)').matches)touch.classList.remove('hidden');running=true;finish=false;speed=0;roadPos=0;playerX=0;lap=1;startTime=performance.now();cars.forEach((a,i)=>a.z=500+i*380);for(let n=3;n>0;n--){msg.textContent=n;await new Promise(r=>setTimeout(r,650))}msg.textContent='GO!';setTimeout(()=>msg.textContent='',700)};
function curveAt(z){return Math.sin((roadPos+z)/900)*.75+Math.sin((roadPos+z)/2400)*.9}
function update(dt){if(!running||finish)return;const accel=(gas||keys['arrowup']||keys['w'])?78:0;const dec=(brake||keys['arrowdown']||keys['s'])?135:18;speed+=accel*dt;speed-=dec*dt;const max=mode==='neon'?330:mode==='snow'?220:280;speed=Math.max(0,Math.min(max,speed));let input=(keys['arrowleft']||keys['a']?-1:0)+(keys['arrowright']||keys['d']?1:0);if(Math.abs(steer)>.03)input=steer;if(Math.abs(tilt)>.08)input=tilt;const grip=mode==='snow'?.68:1;playerX+=input*dt*(1.1+speed/125)*grip;playerX-=curveAt(90)*dt*speed/215;if(Math.abs(playerX)>1.12){speed-=90*dt;playerX=Math.max(-1.3,Math.min(1.3,playerX))}roadPos+=speed*dt*2.15;cars.forEach(car=>{car.z+=(car.speed-speed)*dt*2.15;if(car.z<-80)car.z+=2100;if(car.z>2200)car.z-=2100;if(car.z<150&&car.z>-15&&Math.abs(playerX-car.x)<.25){speed*=.72;car.z+=100}});if(roadPos>5200*lap){lap++;if(lap>3){finish=true;running=false;msg.textContent='FINISH!';setTimeout(()=>{msg.textContent='';menu.classList.remove('hidden');hud.classList.add('hidden');lapHud.classList.add('hidden');touch.classList.add('hidden')},2600)}}speedEl.textContent=Math.round(speed);lapEl.textContent=Math.min(lap,3)+' / 3';timeEl.textContent=((performance.now()-startTime)/1000).toFixed(1);const ahead=cars.filter(a=>a.z>0&&a.z<900).length;placeEl.textContent=(1+ahead)+' / 6'}
function project(z,lane){const horizon=H*.34;const p=Math.max(.001,1-z/1500);const y=horizon+(H-horizon)*p*p;const roadHalf=W*(.06+.5*p);const center=W/2+(curveAt(z)*W*.18*p)-(playerX*roadHalf*.78);return{x:center+lane*roadHalf,y,scale:p,roadHalf}}
function draw(){const t=themes[mode];x.fillStyle=t.sky;x.fillRect(0,0,W,H);const horizon=H*.34;const grad=x.createLinearGradient(0,horizon,0,H);grad.addColorStop(0,t.ground);grad.addColorStop(1,'#020617');x.fillStyle=grad;x.fillRect(0,horizon,W,H-horizon);if(mode==='city'||mode==='neon'){for(let i=0;i<24;i++){const bx=(i*97-roadPos*.08)%(W+140)-70,bh=35+(i*43)%150;x.fillStyle=mode==='neon'?'#160b2e':'#0f172a';x.fillRect(bx,horizon-bh,55,bh);x.fillStyle=mode==='neon'?'#f0abfc':'#fde68a';for(let wy=horizon-bh+10;wy<horizon-5;wy+=14)x.fillRect(bx+8,wy,5,4)}}
for(let z=1500;z>0;z-=45){const a=project(z,0),b=project(z-45,0),la=project(z,-1),ra=project(z,1),lb=project(z-45,-1),rb=project(z-45,1);x.fillStyle=((Math.floor((roadPos+z)/90)%2)?t.edge:'#ef4444');x.beginPath();x.moveTo(la.x-a.roadHalf*.08,la.y);x.lineTo(lb.x-b.roadHalf*.08,lb.y);x.lineTo(lb.x,lb.y);x.lineTo(la.x,la.y);x.fill();x.beginPath();x.moveTo(ra.x+a.roadHalf*.08,ra.y);x.lineTo(rb.x+b.roadHalf*.08,rb.y);x.lineTo(rb.x,rb.y);x.lineTo(ra.x,ra.y);x.fill();x.fillStyle=t.road;x.beginPath();x.moveTo(la.x,la.y);x.lineTo(lb.x,lb.y);x.lineTo(rb.x,rb.y);x.lineTo(ra.x,ra.y);x.fill();if(Math.floor((roadPos+z)/100)%2===0){x.fillStyle=t.stripe;[-.33,.33].forEach(l=>{const p1=project(z,l),p2=project(z-45,l),w=Math.max(1,p1.scale*5);x.beginPath();x.moveTo(p1.x-w,p1.y);x.lineTo(p2.x-w,p2.y);x.lineTo(p2.x+w,p2.y);x.lineTo(p1.x+w,p1.y);x.fill()})}}
cars.slice().sort((a,b)=>b.z-a.z).forEach(car=>{if(car.z<20||car.z>1450)return;const p=project(car.z,car.x),w=62*p.scale,h=38*p.scale;x.fillStyle='#0008';x.fillRect(p.x-w*.52,p.y-h*.15,w*1.04,h*.32);x.fillStyle=car.color;x.fillRect(p.x-w/2,p.y-h,w,h);x.fillStyle='#111827';x.fillRect(p.x-w*.32,p.y-h*.82,w*.64,h*.34);x.fillStyle='#fef08a';x.fillRect(p.x-w*.42,p.y-h*.24,w*.18,h*.12);x.fillRect(p.x+w*.24,p.y-h*.24,w*.18,h*.12)});
const carY=H*.86,carW=Math.min(220,W*.34),carH=72;x.save();x.translate(W/2,carY);x.rotate(-steer*.08);x.fillStyle='#0ea5e9';x.beginPath();x.roundRect(-carW/2,-carH/2,carW,carH,22);x.fill();x.fillStyle='#082f49';x.fillRect(-carW*.28,-carH*.42,carW*.56,carH*.25);x.fillStyle='#ef4444';x.fillRect(-carW*.43,carH*.22,carW*.18,8);x.fillRect(carW*.25,carH*.22,carW*.18,8);x.restore();if(!running){x.fillStyle='#ffffffaa';x.font='700 16px system-ui';x.textAlign='center';x.fillText('SORA RACING VR',W/2,H-30)}}
function loop(now){const dt=Math.min(.04,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
if(navigator.xr){navigator.xr.isSessionSupported('immersive-vr').then(ok=>{if(!ok)return;vrButton.classList.remove('hidden');vrButton.onclick=async()=>{try{const session=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor']});vrButton.textContent='VR接続中';session.addEventListener('end',()=>vrButton.textContent='🥽 VRモード')}catch(e){vrButton.textContent='VRを開始できません'}}})}
})();
</script>
</body>
</html>
