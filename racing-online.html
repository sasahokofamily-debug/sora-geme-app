<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07111f"><title>SORA RACING ONLINE</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020617;color:#fff;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}.panel{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:radial-gradient(circle at 50% 20%,#164e63,#020617 70%)}.card{width:min(620px,95vw);max-height:94vh;overflow:auto;padding:22px;border:1px solid #38bdf8;border-radius:22px;background:#020617f2;text-align:center}.hidden{display:none!important}h1{margin:0;color:#67e8f9;font-size:clamp(32px,9vw,58px)}button,a{display:flex;justify-content:center;align-items:center;width:100%;min-height:48px;margin-top:11px;padding:12px;border:0;border-radius:13px;background:#0284c7;color:#fff;text-decoration:none;font-size:16px;font-weight:900;cursor:pointer}.secondary{background:#334155}.danger{background:#dc2626}input{width:100%;padding:15px;margin:10px 0;border:2px solid #38bdf8;border-radius:13px;background:#07111f;color:#fff;text-align:center;font-size:26px;font-weight:900;letter-spacing:.2em}.status{padding:10px;border-radius:12px;background:#082f49;color:#bae6fd;line-height:1.55}.players{text-align:left;margin:12px 0;padding:10px;border:1px solid #334155;border-radius:12px;background:#0f172a}.hud{position:fixed;z-index:5;top:10px;left:10px;padding:10px 12px;border:1px solid #38bdf8;border-radius:12px;background:#020617cc;font-weight:900}.right{left:auto;right:10px;text-align:right}.controls{position:fixed;inset:0;z-index:6;pointer-events:none}.steer,.pedal{position:absolute;bottom:20px;pointer-events:auto;touch-action:none;border:2px solid #fff8;background:#0f172aaa;color:#fff}.steer{left:18px;width:125px;height:125px;border-radius:50%;font-size:42px}.pedal{right:18px;width:92px;height:125px;border-radius:20px;font-weight:900}.brake{right:122px;height:88px;background:#7f1d1dcc}.msg{position:fixed;z-index:8;left:50%;top:23%;transform:translate(-50%,-50%);font-size:clamp(34px,12vw,86px);font-weight:1000;text-shadow:0 5px 24px #000}.roomBadge{color:#fde68a;font-size:28px;font-weight:1000;letter-spacing:.18em}@media(max-width:600px){.card{padding:16px}.hud{font-size:11px}.right{top:68px}.steer{width:112px;height:112px}.pedal{width:80px;height:112px}.brake{right:106px;height:78px}}</style></head><body>
<canvas id="game"></canvas><div id="hud" class="hud hidden">速度 <b id="speed">0</b><br>順位 <b id="place">1 / 1</b></div><div id="roomHud" class="hud right hidden">ROOM <b id="roomHudCode">------</b><br><span id="netState">接続中</span></div><div id="msg" class="msg"></div><div id="touch" class="controls hidden"><button id="steer" class="steer">↔</button><button id="brake" class="pedal brake">BRAKE</button><button id="gas" class="pedal">GAS</button></div>
<div id="lobby" class="panel"><div class="card"><h1>ONLINE RACING</h1><p>部屋番号で友だちと対戦</p><button id="createRoom">部屋を作る</button><input id="roomInput" inputmode="numeric" maxlength="6" placeholder="6桁の部屋番号"><button id="joinRoom">部屋に入る</button><div id="status" class="status">Firebaseへ接続します。</div><a class="secondary" href="./racing.html">通常Racingへ戻る</a></div></div>
<div id="waiting" class="panel hidden"><div class="card"><h2>待機ルーム</h2><div class="roomBadge" id="roomCode">------</div><p>この番号を相手に教えてください。</p><div id="players" class="players"></div><button id="startOnline">レース開始</button><button id="leaveRoom" class="danger">部屋を出る</button></div></div>
<div id="result" class="panel hidden"><div class="card"><h2 id="resultTitle">FINISH!</h2><div id="resultText" class="status"></div><button id="backLobby">ロビーへ戻る</button></div></div>
<script>(()=>{'use strict';const $=id=>document.getElementById(id),CONFIG='shooking2_firebase_config',VER='10.12.5';let app,auth,db,user,room='',roomRef,unsubRoom,unsubPlayers,syncTimer,host=false,running=false,last=0,speed=0,pos=0,xpos=0,gas=false,brake=false,steer=0,startAt=0,remote=[];const c=$('game'),g=c.getContext('2d');let W,H,DPR=1;
function load(src,id){return new Promise((ok,no)=>{if(document.getElementById(id))return ok();const s=document.createElement('script');s.id=id;s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}function cfg(){try{return JSON.parse(localStorage.getItem(CONFIG)||'null')}catch{return null}}function say(t,e=false){$('status').textContent=t;$('status').style.color=e?'#fca5a5':'#bae6fd'}async function init(){const v=cfg();if(!v)throw Error('ShookingのFirebase設定がありません');await load(`https://www.gstatic.com/firebasejs/${VER}/firebase-app-compat.js`,'onApp');await load(`https://www.gstatic.com/firebasejs/${VER}/firebase-auth-compat.js`,'onAuth');await load(`https://www.gstatic.com/firebasejs/${VER}/firebase-firestore-compat.js`,'onDb');app=firebase.apps.length?firebase.app():firebase.initializeApp(v);auth=app.auth();db=app.firestore();user=auth.currentUser;if(!user){try{const r=await auth.signInAnonymously();user=r.user}catch{throw Error('オンラインはGoogleログイン後に利用してください')}}say('接続しました。部屋を作成または参加できます。')}init().catch(e=>say(e.message,true));
function name(){const s=JSON.parse(localStorage.getItem('soraRacingSession')||'null');return s?.name||user?.displayName||'Player'}function code(){return String(Math.floor(100000+Math.random()*900000))}async function create(){if(!db)return say('まだ接続中です',true);room=code();roomRef=db.collection('racingRooms').doc(room);await roomRef.set({host:user.uid,state:'waiting',createdAt:firebase.firestore.FieldValue.serverTimestamp(),startAt:0});host=true;await enter()}async function join(){room=$('roomInput').value.replace(/\D/g,'').slice(0,6);if(room.length!==6)return say('6桁の部屋番号を入力してください',true);roomRef=db.collection('racingRooms').doc(room);const s=await roomRef.get();if(!s.exists)return say('その部屋は見つかりません',true);host=s.data().host===user.uid;await enter()}async function enter(){await roomRef.collection('players').doc(user.uid).set({name:name(),x:0,pos:0,speed:0,finished:false,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});$('lobby').classList.add('hidden');$('waiting').classList.remove('hidden');$('roomCode').textContent=room;$('roomHudCode').textContent=room;$('startOnline').classList.toggle('hidden',!host);watch()}function watch(){unsubRoom?.();unsubPlayers?.();unsubRoom=roomRef.onSnapshot(s=>{const d=s.data();if(d?.state==='racing'&&!running)begin(Number(d.startAt)||Date.now()+2500)});unsubPlayers=roomRef.collection('players').onSnapshot(s=>{remote=s.docs.map(d=>({id:d.id,...d.data()}));$('players').innerHTML=remote.map(p=>`🏎️ ${p.name}${p.id===user.uid?'（あなた）':''}`).join('<br>')||'参加者なし';if(running)updatePlace()})}async function start(){if(!host)return;await roomRef.set({state:'racing',startAt:Date.now()+3000},{merge:true})}async function leave(){running=false;clearInterval(syncTimer);unsubRoom?.();unsubPlayers?.();try{await roomRef?.collection('players').doc(user.uid).delete()}catch{}$('waiting').classList.add('hidden');$('result').classList.add('hidden');$('lobby').classList.remove('hidden')}
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();function hold(el,on,off){el.onpointerdown=e=>{e.preventDefault();on()};el.onpointerup=el.onpointercancel=e=>{e.preventDefault();off()}}hold($('gas'),()=>gas=true,()=>gas=false);hold($('brake'),()=>brake=true,()=>brake=false);let pid;$('steer').onpointerdown=e=>{pid=e.pointerId;$('steer').setPointerCapture(pid)};$('steer').onpointermove=e=>{if(e.pointerId!==pid)return;const r=$('steer').getBoundingClientRect();steer=Math.max(-1,Math.min(1,(e.clientX-r.left-r.width/2)/(r.width*.4)))};$('steer').onpointerup=()=>steer=0;const keys={};onkeydown=e=>keys[e.key.toLowerCase()]=1;onkeyup=e=>keys[e.key.toLowerCase()]=0;
async function begin(t){$('waiting').classList.add('hidden');$('hud').classList.remove('hidden');$('roomHud').classList.remove('hidden');if(matchMedia('(pointer:coarse)').matches)$('touch').classList.remove('hidden');pos=0;xpos=0;speed=0;running=true;startAt=t;for(let n=3;n>0;n--){$('msg').textContent=n;await new Promise(r=>setTimeout(r,1000))}$('msg').textContent='GO!';setTimeout(()=>$('msg').textContent='',600);syncTimer=setInterval(sync,180)}async function sync(){if(!running)return;try{await roomRef.collection('players').doc(user.uid).set({name:name(),x:xpos,pos,speed,finished:pos>=5200,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});$('netState').textContent='ONLINE'}catch{$('netState').textContent='再接続中'}}function updatePlace(){const sorted=[...remote].sort((a,b)=>(b.pos||0)-(a.pos||0));const i=sorted.findIndex(p=>p.id===user.uid);$('place').textContent=`${i<0?1:i+1} / ${Math.max(1,sorted.length)}`}
function update(dt){if(!running)return;const a=gas||keys.arrowup||keys.w,b=brake||keys.arrowdown||keys.s;speed+=((a?85:0)-(b?145:16))*dt;speed=Math.max(0,Math.min(300,speed));let s=(keys.arrowleft||keys.a?-1:0)+(keys.arrowright||keys.d?1:0);if(Math.abs(steer)>.03)s=steer;xpos+=s*dt*(1.2+speed/130);xpos=Math.max(-1.25,Math.min(1.25,xpos));if(Math.abs(xpos)>1.05)speed=Math.max(0,speed-100*dt);pos+=speed*dt*2.1;$('speed').textContent=Math.round(speed);if(pos>=5200)finish()}async function finish(){if(!running)return;running=false;clearInterval(syncTimer);$('touch').classList.add('hidden');await sync();const sorted=[...remote.filter(p=>p.id!==user.uid),{id:user.uid,name:name(),pos:5200,finished:true}].sort((a,b)=>(b.pos||0)-(a.pos||0));const rank=sorted.findIndex(p=>p.id===user.uid)+1;$('resultTitle').textContent=rank===1?'🏆 YOU WIN!':'FINISH!';$('resultText').textContent=`順位 ${rank} / ${sorted.length}`;$('result').classList.remove('hidden')}
function project(z,lane){const h=H*.34,p=Math.max(.001,1-z/1500),y=h+(H-h)*p*p,half=W*(.06+.5*p),center=W/2-xpos*half*.78;return{x:center+lane*half,y,scale:p,half}}function draw(){g.fillStyle='#071b36';g.fillRect(0,0,W,H);const h=H*.34;g.fillStyle='#101827';g.fillRect(0,h,W,H-h);for(let z=1500;z>0;z-=45){const l=project(z,-1),r=project(z,1),l2=project(z-45,-1),r2=project(z-45,1);g.fillStyle='#263442';g.beginPath();g.moveTo(l.x,l.y);g.lineTo(l2.x,l2.y);g.lineTo(r2.x,r2.y);g.lineTo(r.x,r.y);g.fill()}remote.filter(p=>p.id!==user?.uid).forEach((p,i)=>{let z=(p.pos||0)-pos+500;if(z<20||z>1450)return;const q=project(z,p.x||0),w=62*q.scale,hh=38*q.scale;g.fillStyle=['#ef4444','#22c55e','#f59e0b','#a855f7'][i%4];g.fillRect(q.x-w/2,q.y-hh,w,hh)});const cw=Math.min(220,W*.34);g.fillStyle='#0ea5e9';g.beginPath();g.roundRect(W/2-cw/2,H*.82,cw,72,20);g.fill()}function loop(n){const dt=Math.min(.04,(n-last)/1000||0);last=n;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
$('createRoom').onclick=create;$('joinRoom').onclick=join;$('startOnline').onclick=start;$('leaveRoom').onclick=leave;$('backLobby').onclick=leave;addEventListener('beforeunload',()=>{try{roomRef?.collection('players').doc(user.uid).delete()}catch{}})})();</script></body></html>
