<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02030a">
<meta name="robots" content="noindex">
<title>SHOO KING II</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#02030a;color:#e5f8ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;place-items:center;background:radial-gradient(circle at 50% 18%,rgba(14,165,233,.18),transparent 34%),#02030a}.box{width:min(420px,90vw);padding:28px;border:1px solid rgba(103,232,249,.35);border-radius:22px;background:rgba(2,6,23,.94);text-align:center;box-shadow:0 24px 80px #0009}h1{margin:0 0 8px;color:#67e8f9}p{color:#a9c5d6;line-height:1.7}.ring{width:58px;height:58px;margin:0 auto 18px;border:4px solid #164e63;border-top-color:#67e8f9;border-radius:50%;animation:s .7s linear infinite}a{display:block;margin-top:16px;padding:12px;border-radius:11px;background:#1f8cff;color:white;text-decoration:none;font-weight:900}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main class="box"><div class="ring"></div><h1>SHOO KING II</h1><p>安定起動ランチャーへ移動しています…</p><a id="manual" href="./launch.html">起動しない場合はこちら</a></main>
<script>
(()=>{
  const target=new URL('./launch.html',location.href);
  target.searchParams.set('from','legacy-index');
  target.searchParams.set('v','128');
  document.getElementById('manual').href=target.href;
  try{
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'}).then(reg=>reg.update().catch(()=>{})).catch(()=>{});
    }
  }catch(e){}
  setTimeout(()=>location.replace(target.href),40);
})();
</script>
</body>
</html>
