<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02030a">
<meta name="robots" content="noindex">
<title>SHOO KING II</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#02030a;color:#e5f8ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 20%,rgba(14,165,233,.17),transparent 34%),linear-gradient(145deg,#01030a,#061126 55%,#02030a)}.boot{width:min(430px,90vw);padding:28px;border:1px solid rgba(103,232,249,.35);border-radius:24px;background:rgba(2,6,23,.86);box-shadow:0 28px 90px rgba(0,0,0,.58),0 0 40px rgba(56,189,248,.13);text-align:center}.mark{width:86px;height:86px;margin:0 auto 18px;border:1px solid rgba(103,232,249,.45);border-radius:50%;display:grid;place-items:center;box-shadow:0 0 28px rgba(56,189,248,.2);position:relative}.mark:before,.mark:after{content:"";position:absolute;background:rgba(103,232,249,.28)}.mark:before{width:1px;height:120%}.mark:after{height:1px;width:120%}.ship{width:30px;height:44px;clip-path:polygon(50% 0,76% 46%,100% 82%,62% 68%,50% 100%,38% 68%,0 82%,24% 46%);background:linear-gradient(#fff,#67e8f9 45%,#2563eb);filter:drop-shadow(0 0 12px #38bdf8)}h1{margin:0;color:#fff;font-size:30px;letter-spacing:.04em}p{margin:8px 0 18px;color:#93a7bd;font-size:13px;line-height:1.6}.bar{height:8px;border-radius:999px;background:#0f172a;overflow:hidden;border:1px solid rgba(103,232,249,.16)}.fill{width:20%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#06b6d4,#2563eb,#7c3aed);animation:load 1.15s ease-in-out infinite alternate}.status{margin-top:13px;color:#67e8f9;font:800 11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;white-space:pre-wrap}.retry{display:none;width:100%;margin-top:18px;padding:12px;border:0;border-radius:12px;background:#1f8cff;color:#fff;font-weight:900;cursor:pointer}@keyframes load{from{width:18%}to{width:88%}}
</style>
</head>
<body>
<main class="boot">
  <div class="mark"><div class="ship"></div></div>
  <h1>SHOO KING II</h1>
  <p>COMMAND SYSTEM を準備しています。旧UIを表示せず、最新版のログイン・設定・ガチャを読み込みます。</p>
  <div class="bar"><div class="fill"></div></div>
  <div id="status" class="status">BOOTING COMMAND SYSTEM...</div>
  <button id="retry" class="retry" type="button">再試行</button>
</main>
<script>
(()=>{
  const BUILD='123-support-center';
  const status=document.getElementById('status');
  const retry=document.getElementById('retry');
  let finished=false;
  const say=t=>{status.textContent=t};
  async function waitForController(timeout=7000){
    if(navigator.serviceWorker.controller)return true;
    return new Promise(resolve=>{
      let done=false;
      const finish=v=>{if(done)return;done=true;clearTimeout(timer);navigator.serviceWorker.removeEventListener('controllerchange',onChange);resolve(v)};
      const onChange=()=>finish(!!navigator.serviceWorker.controller);
      const timer=setTimeout(()=>finish(!!navigator.serviceWorker.controller),timeout);
      navigator.serviceWorker.addEventListener('controllerchange',onChange);
    });
  }
  async function boot(){
    if(finished)return;
    retry.style.display='none';
    if(!('serviceWorker' in navigator)){
      say('SERVICE WORKER 未対応のため起動できません');retry.style.display='block';return;
    }
    try{
      say('SERVICE WORKER を確認中...');
      const reg=await navigator.serviceWorker.register('./sw.js?v='+BUILD,{updateViaCache:'none'});
      await reg.update().catch(()=>{});
      await navigator.serviceWorker.ready;
      say('LATEST UI MODULES を接続中...');
      const controlled=await waitForController();
      if(!controlled){
        say('最新版の制御をまだ取得できません。\n「再試行」を押してください。');retry.style.display='block';return;
      }
      finished=true;
      say('COMMAND SYSTEM ONLINE');
      const next=new URL('./game-core.html',location.href);
      next.searchParams.set('play','1');
      next.searchParams.set('boot',BUILD);
      location.replace(next.href);
    }catch(error){
      console.error(error);
      say('BOOT ERROR: '+(error?.message||error));
      retry.style.display='block';
    }
  }
  retry.addEventListener('click',boot);
  boot();
})();
</script>
</body>
</html>
