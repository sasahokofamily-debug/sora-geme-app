<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02030a">
<meta name="robots" content="noindex">
<title>SHOO KING II</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#02030a;color:#e7faff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 18%,rgba(14,165,233,.18),transparent 34%),#02030a}.boot{width:min(440px,90vw);padding:28px;border:1px solid rgba(103,232,249,.4);border-radius:22px;background:rgba(2,6,23,.94);box-shadow:0 24px 80px #0009,0 0 36px #38bdf833;text-align:center}.ring{width:64px;height:64px;margin:0 auto 18px;border:4px solid #164e63;border-top-color:#67e8f9;border-right-color:#38bdf8;border-radius:50%;animation:spin .75s linear infinite}h1{margin:0 0 8px;color:#67e8f9;font-size:30px}.msg{min-height:44px;color:#a9c5d6;font:800 12px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap}.bar{height:7px;margin-top:16px;border-radius:99px;background:#0f172a;overflow:hidden}.fill{height:100%;width:35%;border-radius:inherit;background:linear-gradient(90deg,#06b6d4,#3b82f6,#8b5cf6);animation:move 1.1s ease-in-out infinite alternate}.retry{display:none;width:100%;margin-top:18px;padding:12px;border:0;border-radius:11px;background:#1f8cff;color:#fff;font-weight:900;cursor:pointer}@keyframes spin{to{transform:rotate(360deg)}}@keyframes move{to{width:92%}}
</style>
</head>
<body>
<main class="boot">
<div class="ring"></div><h1>SHOO KING II</h1>
<div id="msg" class="msg">CORE を直接読み込み中...\nSERVICE WORKER に依存しない起動経路</div>
<div class="bar"><div class="fill"></div></div>
<button id="retry" class="retry" type="button">再試行</button>
</main>
<script>
(()=>{
'use strict';
const BUILD='128-direct-launch';
const msg=document.getElementById('msg');
const retry=document.getElementById('retry');
const managed=[
 'auth-first-paint.js','boot-resilience.js','button-actions.js','key-event-guard.js','firebase-config.js','auth-session-fix.js','google-login.js','google-login-fix.js','firebase-error-patch.js','firebase-login-fallback.js','firebase-login-rescue.js','guest-login.js','password-change.js','password-reset-fix.js','login-style.js','login-command-extras.js','game-entry-rescue.js','runtime-light-fix.js','deferred-runtime.js',
 'seasonal-gacha-fix.js','cache-coherence.js','login-cool.js','login-failure-effect.js','login-success-warp.js','startup-loading.js',
 'hard-stages.js','hangar-fix.js','online-pve.js','multiplayer-sync.js','online-team-fix.js','shared-enemy-sync.js','gacha-upgrade.js','gacha-current-filter.js','gacha-11.js','current-ui-suite.js','current-ui-extra.js','home-menu-restore.js','error-voice-assist.js','bug-report-center.js'
];
const critical=[
 'fixjs/boot-resilience.js',
 'button-actions.js',
 'fixjs/key-event-guard.js',
 'firebase-config.js',
 'fixjs/auth-session-fix.js',
 'google-login.js',
 'fixjs/google-login-fix.js',
 'fixjs/firebase-error-patch.js',
 'fixjs/firebase-login-fallback.js',
 'fixjs/firebase-login-rescue.js',
 'guest-login.js',
 'password-change.js',
 'fixjs/password-reset-fix.js',
 'login-style.js',
 'plusjs/login-command-extras.js',
 'fixjs/game-entry-rescue.js',
 'fixjs/runtime-light-fix.js',
 'fixjs/deferred-runtime.js'
];
function say(text){msg.textContent=text}
function basename(src){try{return new URL(src,location.href).pathname.split('/').pop()}catch(e){return String(src).split('/').pop().split('?')[0]}}
function script(path,doc){const s=doc.createElement('script');s.src=`./${path}?v=${BUILD}`;s.setAttribute('data-shooking-runtime',BUILD);return s}
async function load(){
 retry.style.display='none';
 try{
  say('GAME CORE を取得中...');
  const coreUrl=new URL('./game-core.html',location.href);
  coreUrl.searchParams.set('runtime',BUILD);
  const response=await fetch(coreUrl.href,{cache:'no-store',headers:{'x-shooking-launch':BUILD}});
  if(!response.ok)throw new Error(`game-core HTTP ${response.status}`);
  let html=await response.text();
  if(!html.includes('SHOO KING II'))throw new Error('game-core の内容を確認できません');

  // A raw game-core still contains an old versioned SW registration. Canonicalize it.
  html=html.replace(/\.\/sw\.js\?[^"'`\s)]+/g,'./sw.js');
  const doc=new DOMParser().parseFromString(html,'text/html');
  if(!doc.body)throw new Error('game-core HTML の解析に失敗しました');

  doc.querySelectorAll('script[src]').forEach(el=>{if(managed.includes(basename(el.getAttribute('src')||'')))el.remove()});
  doc.querySelectorAll('meta[name="shooking-build"]').forEach(el=>el.remove());
  const meta=doc.createElement('meta');meta.name='shooking-build';meta.content=BUILD;doc.head.appendChild(meta);

  // This runs before the original game body so the raw home screen can never flash first.
  const first=script('fixjs/auth-first-paint.js',doc);
  doc.body.insertBefore(first,doc.body.firstChild);

  for(const path of critical)doc.body.appendChild(script(path,doc));

  const marker=doc.createElement('script');
  marker.textContent=`window.__SHOOKING_DIRECT_LAUNCH__=${JSON.stringify(BUILD)};document.documentElement.dataset.shookingLaunch=${JSON.stringify(BUILD)};`;
  doc.body.appendChild(marker);

  say('RUNTIME を接続中...');
  const output='<!doctype html>\n'+doc.documentElement.outerHTML;
  document.open();document.write(output);document.close();
 }catch(error){
  console.error('SHOO KING direct launch failed',error);
  say('起動に失敗しました\n'+String(error?.message||error));
  retry.style.display='block';
 }
}
retry.addEventListener('click',load);
load();
})();
</script>
</body>
</html>
