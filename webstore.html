<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>WebStore</title>
<style>
:root{color-scheme:light;--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#d2d2d7;--blue:#0071e3;--soft:#e8f2ff;--red:#d70015}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:0 0 calc(82px + env(safe-area-inset-bottom))}button,input,textarea,select{font:inherit}button{cursor:pointer}#shookingCommonNav,#shookingBreadcrumb,#shookingGameExit{display:none!important}.wrap{width:min(1050px,calc(100% - 26px));margin:auto}.head{display:flex;align-items:flex-end;gap:14px;padding:25px 0 15px}.date{margin:0 0 4px;color:var(--muted);font-size:12px;font-weight:800}.head h1{margin:0;font-size:clamp(38px,7vw,54px);line-height:.95;letter-spacing:-.05em}.profile{margin-left:auto;width:46px;height:46px;border:0;border-radius:50%;background:linear-gradient(145deg,#58a9ff,#6558ea);color:#fff;font-weight:900}.view{display:none}.view.active{display:block}.section{padding:22px 0;border-top:1px solid var(--line)}.section.first{border-top:0;padding-top:0}.features{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.feature{min-height:270px;padding:24px;border:0;border-radius:24px;color:#fff;text-align:left;position:relative;overflow:hidden}.feature.shoot{background:linear-gradient(145deg,#091f39,#1262ad 56%,#332d78)}.feature.study{background:linear-gradient(145deg,#0f5132,#198754 56%,#55b77e)}.feature h2{margin:10px 0 8px;font-size:clamp(30px,5vw,44px);line-height:1}.feature p{max-width:520px;margin:0;opacity:.85;line-height:1.55}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.08em;opacity:.82}.featureIcon{position:absolute;right:22px;bottom:16px;font-size:84px}.sectionHead{display:flex;align-items:flex-end;gap:12px;margin-bottom:13px}.sectionHead h2{margin:0;font-size:25px}.sectionHead p{margin:0;color:var(--muted);font-size:13px}.link{margin-left:auto;border:0;background:none;color:var(--blue);font-weight:800}.appList{overflow:hidden;border-radius:20px;background:var(--card)}.appRow{display:grid;grid-template-columns:70px minmax(0,1fr) auto auto;align-items:center;gap:13px;margin:0 17px;padding:14px 0;border-bottom:1px solid #e5e5ea}.appRow:last-child{border-bottom:0}.icon{width:70px;height:70px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(145deg,#153e6c,#2e82c7 56%,#6151d8);font-size:37px}.icon.study{background:linear-gradient(145deg,#0f5132,#198754 56%,#72c795)}.meta{min-width:0}.meta h3{margin:0 0 4px;font-size:17px}.meta p{margin:0;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.get{border:0;border-radius:999px;padding:8px 16px;background:var(--soft);color:var(--blue);font-weight:900}.more{width:38px;height:38px;border:0;border-radius:50%;background:#ececf1;font-weight:900}.categories{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.category{border:0;border-radius:18px;padding:18px;background:#fff;text-align:left}.category span{font-size:29px}.category strong{display:block;margin:7px 0 2px}.category small{color:var(--muted)}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:14px}.chip{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:8px 13px;background:#fff;font-weight:800}.chip.active{border-color:var(--blue);background:var(--blue);color:#fff}.search{position:relative;margin-bottom:15px}.search span{position:absolute;left:15px;top:11px;color:#777}.search input{width:100%;height:46px;border:0;border-radius:13px;padding:0 14px 0 42px;background:#e4e4e9;outline:none}.libraryHero{display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;padding:20px;border-radius:20px;background:#fff}.libraryHero h2{margin:0 0 5px}.libraryHero p{margin:0;color:var(--muted)}.primary,.secondary,.danger{border:0;border-radius:12px;padding:11px 15px;font-weight:900}.primary{background:var(--blue);color:#fff}.secondary{background:#ececf1}.danger{background:#ffe9ec;color:var(--red)}.wide{width:100%;margin-top:9px}.empty{padding:32px;border-radius:18px;background:#fff;color:var(--muted);text-align:center}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;border-top:1px solid #d9d9de;background:#f7f7f9e8;backdrop-filter:blur(20px);padding-bottom:env(safe-area-inset-bottom)}.bottomIn{width:min(580px,100%);height:69px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.tab{border:0;background:none;color:#777;font-size:11px;font-weight:800}.tab b{display:block;font-size:20px}.tab.active{color:var(--blue)}.sheet{position:fixed;inset:0;z-index:60;display:none;place-items:end center;background:#0006}.sheet.open{display:grid}.panel{width:min(580px,100%);max-height:90vh;overflow:auto;border-radius:25px 25px 0 0;padding:22px;background:#fff}.panelHead{display:flex;align-items:center}.panelHead h2{margin:0}.close{margin-left:auto;width:38px;height:38px;border:0;border-radius:50%;background:#ececf1}.field{margin:12px 0}.field label{display:block;margin-bottom:6px;font-size:13px;font-weight:800}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px}.field textarea{min-height:80px}.account{padding:17px;border-radius:18px;background:#f2f2f7}.account strong{display:block;font-size:20px}.account small,.note{color:var(--muted)}.note{font-size:12px;line-height:1.6}.toast{position:fixed;left:50%;bottom:90px;z-index:100;transform:translateX(-50%) translateY(15px);opacity:0;padding:10px 15px;border-radius:999px;background:#1d1d1f;color:#fff;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:760px){.features{grid-template-columns:1fr}.feature{min-height:220px}.categories{grid-template-columns:1fr 1fr}.appRow{grid-template-columns:60px minmax(0,1fr) auto auto;gap:9px;margin:0 13px}.icon{width:60px;height:60px;font-size:31px}.meta p{max-width:34vw}.libraryHero{grid-template-columns:1fr}.libraryHero button{width:100%}}
</style>
</head>
<body data-no-common-nav="true">
<main class="wrap">
<header class="head"><div><p class="date" id="date"></p><h1 id="title">おすすめ</h1></div><button class="profile" id="profile" type="button">人</button></header>
<section class="view active" id="todayView"><div class="section first"><div class="features"><button class="feature shoot" data-open="shooking"><span class="eyebrow">WEBSTORE EXCLUSIVE</span><h2>宇宙へ出撃。<br>SHOO KING II</h2><p>武器、機体、ステージを攻略するブラウザシューティング。</p><span class="featureIcon">🚀</span></button><button class="feature study" data-open="guild"><span class="eyebrow">STUDY PICK</span><h2>学びを冒険に。<br>Sora Guild</h2><p>勉強カテゴリのWebアプリ。Vercel版へ直接アクセスできます。</p><span class="featureIcon">📚</span></button></div></div><div class="section"><div class="sectionHead"><div><h2>注目のアプリ</h2><p>すぐ使えるWebアプリ</p></div><button class="link" data-go="games">すべて見る</button></div><div id="todayList"></div></div><div class="section"><div class="sectionHead"><div><h2>カテゴリ</h2><p>ジャンルから探す</p></div></div><div class="categories"><button class="category" data-category="勉強"><span>📚</span><strong>勉強</strong><small>学習・記録</small></button><button class="category" data-category="シューティング"><span>🚀</span><strong>シューティング</strong><small>宇宙・銃撃</small></button><button class="category" data-category="RPG"><span>⚔️</span><strong>RPG</strong><small>冒険と育成</small></button><button class="category" data-category="パズル"><span>🧩</span><strong>パズル</strong><small>考えて解く</small></button><button class="category" data-category="アクション"><span>🏃</span><strong>アクション</strong><small>すぐ遊べる</small></button><button class="category" data-category=""><span>•••</span><strong>すべて</strong><small>全アプリ</small></button></div></div></section>
<section class="view" id="gamesView"><div class="section first"><div class="chips"><button class="chip active" data-filter="">すべて</button><button class="chip" data-filter="勉強">勉強</button><button class="chip" data-filter="シューティング">シューティング</button><button class="chip" data-filter="アクション">アクション</button><button class="chip" data-filter="RPG">RPG</button><button class="chip" data-filter="パズル">パズル</button></div><div id="gamesList"></div></div></section>
<section class="view" id="libraryView"><div class="section first"><div class="libraryHero"><div><h2>マイライブラリ</h2><p id="libraryMessage">認証するとゲームURLを登録できます。</p></div><button class="primary" id="addGame">ゲームを追加</button></div></div><div class="section"><div class="sectionHead"><div><h2>登録したゲーム</h2><p>アカウント別に保存</p></div></div><div id="libraryContent"></div></div><div class="section"><div class="sectionHead"><div><h2>最近使った項目</h2></div></div><div id="recentContent"></div></div></section>
<section class="view" id="searchView"><div class="section first"><label class="search"><span>⌕</span><input id="searchInput" type="search" placeholder="アプリ、ジャンル、URLを検索"></label><button class="secondary wide" id="directOpen">URLを直接入力して開く</button></div><div class="section"><div class="sectionHead"><div><h2>検索結果</h2><p id="searchCount">すべてのアプリ</p></div></div><div id="searchContent"></div></div></section>
</main>
<nav class="bottom"><div class="bottomIn"><button class="tab active" data-tab="today"><b>★</b>おすすめ</button><button class="tab" data-tab="games"><b>▦</b>ゲーム</button><button class="tab" data-tab="library"><b>▣</b>ライブラリ</button><button class="tab" data-tab="search"><b>⌕</b>検索</button></div></nav>
<div class="sheet" id="accountSheet"><section class="panel"><div class="panelHead"><h2>アカウント</h2><button class="close" data-close="accountSheet">×</button></div><div id="accountContent"></div></section></div>
<div class="sheet" id="addSheet"><section class="panel"><div class="panelHead"><h2>ゲームを追加</h2><button class="close" data-close="addSheet">×</button></div><form id="addForm"><div class="field"><label>ゲーム名</label><input id="gameName" required maxlength="60"></div><div class="field"><label>ジャンル</label><select id="gameGenre"><option>勉強</option><option>シューティング</option><option>アクション</option><option>RPG</option><option>パズル</option><option>その他</option></select></div><div class="field"><label>HTMLゲームURL</label><input id="gameUrl" type="url" required placeholder="https://example.com/game.html"></div><div class="field"><label>説明</label><textarea id="gameDescription" maxlength="180"></textarea></div><button class="primary wide">WebStoreに追加</button></form></section></div>
<div class="sheet" id="moreSheet"><section class="panel"><div class="panelHead"><h2 id="moreTitle">アプリ</h2><button class="close" data-close="moreSheet">×</button></div><button class="primary wide" id="moreOpen">開く</button><button class="secondary wide" id="moreCopy">URLをコピー</button><button class="danger wide" id="moreDelete">ライブラリから削除</button></section></div>
<div class="toast" id="toast"></div>
<script>
(()=>{'use strict';const CURRENT='shooking2_current_account',PREFIX='sora_webstore_games_v5_',RECENT='sora_webstore_recent_v5_';const builtins=[{id:'shooking',name:'SHOO KING II',genre:'シューティング',description:'宇宙船、武器、機体を強化して進むブラウザシューティング。',url:new URL('./game?play=1&v=100&_pages=100&_stable=100',location.href).href,icon:'🚀',builtin:true},{id:'guild',name:'Sora Guild',genre:'勉強',description:'勉強を楽しく続けるためのWebアプリ。',url:'https://sora-guild-app.vercel.app/',icon:'📚',builtin:true,study:true}];const $=id=>document.getElementById(id);let filter='',selected=null;const read=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k)||'null');return v??d}catch{return d}};const account=()=>read(CURRENT,null);const aid=()=>{const a=account();return a?.uid||a?.email||a?.accountName||'guest'};const custom=()=>account()?read(PREFIX+aid(),[]):[];const save=v=>localStorage.setItem(PREFIX+aid(),JSON.stringify(v));const apps=()=>[...builtins,...custom()];const valid=v=>{try{const u=new URL(String(v).trim());return/^https?:$/.test(u.protocol)?u.href:''}catch{return''}};function flash(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(flash.t);flash.t=setTimeout(()=>$('toast').classList.remove('show'),2200)}function show(id){$(id).classList.add('open')}function hide(id){$(id).classList.remove('open')}function confirmAuth(){const url=builtins[0].url;const message='このWebページを信頼して開きますか？\n\n発行元: SHOO KING II\n接続先: '+url+'\n\nキャンセルすると移動しません。';if(window.confirm(message))location.href=url}function initial(){const a=account(),n=a?.accountName||a?.name||a?.email||'人';return String(n).trim().charAt(0).toUpperCase()||'人'}function track(g){if(!account())return;const key=RECENT+aid();let ids=read(key,[]);ids=[g.id,...ids.filter(x=>x!==g.id)].slice(0,6);localStorage.setItem(key,JSON.stringify(ids))}function openApp(g){track(g);renderRecent();const w=window.open(g.url,'_blank','noopener,noreferrer');if(!w)location.href=g.url}function row(g){const r=document.createElement('article');r.className='appRow';r.innerHTML='<div class="icon"></div><div class="meta"><h3></h3><p></p></div><button class="get">開く</button><button class="more">•••</button>';r.querySelector('.icon').classList.toggle('study',!!g.study);r.querySelector('.icon').textContent=g.icon||'🎮';r.querySelector('h3').textContent=g.name;r.querySelector('p').textContent=(g.genre||'ゲーム')+' · '+(g.description||'Webアプリ');r.querySelector('.get').onclick=()=>openApp(g);r.querySelector('.more').onclick=()=>more(g);return r}function list(id,data,empty='アプリがありません。'){const el=$(id);if(!data.length){const e=document.createElement('div');e.className='empty';e.textContent=empty;el.replaceChildren(e);return}const box=document.createElement('div');box.className='appList';data.forEach(g=>box.append(row(g)));el.replaceChildren(box)}function renderToday(){list('todayList',apps().slice(0,6))}function renderGames(){list('gamesList',apps().filter(g=>!filter||g.genre===filter))}function renderLibrary(){const a=account();$('libraryMessage').textContent=a?'認証済み。追加したゲームはこのアカウント用に保存されます。':'認証するとゲームURLを登録できます。';list('libraryContent',custom(),a?'まだゲームが登録されていません。':'アカウント認証が必要です。');renderRecent()}function renderRecent(){const map=new Map(apps().map(g=>[g.id,g])),ids=read(RECENT+aid(),[]);list('recentContent',ids.map(id=>map.get(id)).filter(Boolean),'最近開いたアプリはありません。')}function renderSearch(){const q=$('searchInput').value.trim().toLowerCase(),data=apps().filter(g=>[g.name,g.genre,g.description,g.url].join(' ').toLowerCase().includes(q));$('searchCount').textContent=q?data.length+'件':'すべてのアプリ';list('searchContent',data,'検索結果がありません。')}function renderAccount(){const box=$('accountContent'),a=account();$('profile').textContent=initial();box.innerHTML='';if(a){box.innerHTML='<div class="account"><strong></strong><small></small></div><button class="secondary wide" id="accountGame">ゲーム側のアカウント設定を開く</button>';box.querySelector('strong').textContent=a.accountName||a.name||a.email||'Player';box.querySelector('small').textContent=a.email||a.provider||'認証済み';$('accountGame').onclick=confirmAuth}else{box.innerHTML='<div class="account"><strong>WebStoreにサインイン</strong><p class="note">SHOO KING IIと同じアカウントを使います。</p></div><button class="primary wide" id="signIn">SHOO KING IIでログイン</button><button class="secondary wide" id="checkLogin">ログイン状態を確認</button>';$('signIn').onclick=confirmAuth;$('checkLogin').onclick=()=>{renderAll();flash(account()?'認証を確認しました':'まだログインしていません')}}}function requireAccount(){if(account())return true;renderAccount();show('accountSheet');flash('先にアカウント認証してください');return false}function more(g){selected=g;$('moreTitle').textContent=g.name;$('moreDelete').style.display=g.builtin?'none':'block';show('moreSheet')}function tab(name){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$(name+'View').classList.add('active');$('title').textContent={today:'おすすめ',games:'ゲーム',library:'ライブラリ',search:'検索'}[name];if(name==='library')renderLibrary();if(name==='search')renderSearch();scrollTo({top:0,behavior:'smooth'})}function renderAll(){renderToday();renderGames();renderLibrary();renderSearch();renderAccount()}$('date').textContent=new Intl.DateTimeFormat('ja-JP',{month:'long',day:'numeric',weekday:'long'}).format(new Date());document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openApp(builtins.find(g=>g.id===b.dataset.open)));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>tab(b.dataset.go));document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>tab(b.dataset.tab));document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{filter=b.dataset.category;renderGames();tab('games')});document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{filter=c.dataset.filter;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===c));renderGames()});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>hide(b.dataset.close));document.querySelectorAll('.sheet').forEach(s=>s.onclick=e=>{if(e.target===s)hide(s.id)});$('profile').onclick=()=>{renderAccount();show('accountSheet')};$('addGame').onclick=()=>{if(requireAccount())show('addSheet')};$('searchInput').oninput=renderSearch;$('directOpen').onclick=()=>{const v=prompt('開きたいHTMLゲームURLを入力してください。','https://');if(v===null)return;const u=valid(v);if(!u){flash('正しいURLを入力してください');return}openApp({id:'direct-'+Date.now(),name:'Direct URL',url:u,genre:'その他'})};$('addForm').onsubmit=e=>{e.preventDefault();if(!requireAccount())return;const name=$('gameName').value.trim(),url=valid($('gameUrl').value);if(!name||!url){flash('ゲーム名と正しいURLを入力してください');return}const data=custom();data.unshift({id:'game-'+Date.now(),name,genre:$('gameGenre').value,description:$('gameDescription').value.trim(),url,icon:'🎮'});save(data);e.target.reset();hide('addSheet');renderAll();tab('library');flash('ライブラリへ追加しました')};$('moreOpen').onclick=()=>selected&&openApp(selected);$('moreCopy').onclick=async()=>{if(!selected)return;try{await navigator.clipboard.writeText(selected.url);flash('URLをコピーしました')}catch{flash('コピーできませんでした')}};$('moreDelete').onclick=()=>{if(!selected||selected.builtin)return;if(!confirm('「'+selected.name+'」を削除しますか？'))return;save(custom().filter(g=>g.id!==selected.id));hide('moreSheet');renderAll();flash('削除しました')};window.addEventListener('storage',renderAll);window.addEventListener('pageshow',renderAll);renderAll()})();
</script>
</body>
</html>
