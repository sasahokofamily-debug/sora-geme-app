<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>WebStore</title>
<style>
:root{color-scheme:light;--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#d2d2d7;--blue:#0071e3;--red:#d70015}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding-bottom:82px}button,input,textarea,select{font:inherit}
.store{width:min(1080px,calc(100% - 28px));margin:auto}
.head{display:flex;align-items:center;gap:14px;padding:24px 0 12px}.head h1{margin:0;font-size:34px;letter-spacing:-.04em}.headActions{margin-left:auto;display:flex;gap:9px}
.circle{width:42px;height:42px;border:0;border-radius:50%;background:#e8e8ed;color:#25252a;font-weight:900;cursor:pointer}.avatar{background:linear-gradient(145deg,#61a9ff,#6257e7);color:#fff}
.search{position:sticky;top:0;z-index:10;padding:8px 0 14px;background:linear-gradient(var(--bg) 72%,transparent)}
.search input{width:100%;height:44px;border:0;border-radius:12px;background:#e3e3e8;padding:0 14px 0 42px;font-size:16px;outline:none}
.search span{position:absolute;margin:11px 0 0 14px;color:#7b7b80}
.section{padding:22px 0;border-top:1px solid var(--line)}.section:first-of-type{border-top:0}.sectionHead{display:flex;align-items:end;gap:12px;margin-bottom:14px}.sectionHead h2{margin:0;font-size:25px;letter-spacing:-.03em}.sectionHead p{margin:0;color:var(--muted);font-size:13px}.sectionHead button{margin-left:auto;border:0;background:none;color:var(--blue);font-weight:700;cursor:pointer}
.feature{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}.featureMain,.featureSide{border-radius:22px;overflow:hidden;min-height:260px;position:relative;padding:24px;background:linear-gradient(145deg,#0d2b4d,#1462a6 55%,#322c79);color:#fff}.featureSide{background:linear-gradient(145deg,#4d1c63,#9c3f8b 58%,#ee7d77)}
.feature .eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;opacity:.78}.feature h3{margin:10px 0 7px;font-size:32px;line-height:1}.feature p{max-width:520px;margin:0;opacity:.82}.featureIcon{position:absolute;right:24px;bottom:18px;font-size:88px;filter:drop-shadow(0 14px 18px #0005)}
.appList{background:var(--card);border-radius:18px;padding:0 18px}.appRow{display:grid;grid-template-columns:76px minmax(0,1fr) auto auto;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid #e5e5ea}.appRow:last-child{border-bottom:0}
.appIcon{width:76px;height:76px;display:grid;place-items:center;border-radius:18px;background:linear-gradient(145deg,#1c4b7c,#2f83c7 55%,#5d4fd7);font-size:40px;box-shadow:inset 0 0 0 1px #ffffff38}.appMeta h3{margin:0 0 3px;font-size:17px}.appMeta p{margin:0;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.get{min-width:78px;border:0;border-radius:999px;background:#e8f2ff;color:var(--blue);padding:8px 16px;font-weight:800;cursor:pointer}.more{width:38px;height:38px;border:0;border-radius:50%;background:#eeeef2;font-weight:900;cursor:pointer}
.categories{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.cat{border:0;border-radius:16px;background:var(--card);padding:18px;text-align:left;cursor:pointer}.cat span{font-size:30px}.cat strong{display:block;margin-top:8px}.cat small{color:var(--muted)}
.empty{display:none;padding:34px;background:var(--card);border-radius:18px;text-align:center;color:var(--muted)}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;border-top:1px solid #d9d9de;background:#f7f7f9e8;backdrop-filter:blur(20px)}.bottomIn{width:min(520px,100%);height:72px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.tab{border:0;background:none;color:#76767b;font-weight:700}.tab.active{color:var(--blue)}
.sheet{position:fixed;inset:0;z-index:50;display:none;place-items:end center;background:#0006}.sheet.open{display:grid}.panel{width:min(560px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:22px}.panel h2{margin:0 0 16px}.close{float:right;margin-top:-4px}.field{margin:12px 0}.field label{display:block;margin-bottom:6px;font-size:13px;font-weight:700}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.field textarea{min-height:80px}.primary,.secondary,.danger{width:100%;border:0;border-radius:12px;padding:12px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{margin-top:9px;background:#ececf1}.danger{margin-top:9px;background:#ffe9ec;color:var(--red)}.accountCard{padding:16px;border-radius:16px;background:#f2f2f7}.accountCard strong{font-size:20px}.note{font-size:12px;color:var(--muted);line-height:1.6}
.toast{position:fixed;left:50%;bottom:88px;z-index:80;transform:translateX(-50%) translateY(20px);opacity:0;background:#1d1d1f;color:#fff;padding:10px 15px;border-radius:999px;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:720px){.feature{grid-template-columns:1fr}.featureSide{min-height:210px}.categories{grid-template-columns:1fr 1fr}.appRow{grid-template-columns:64px minmax(0,1fr) auto auto;gap:10px}.appIcon{width:64px;height:64px;border-radius:15px;font-size:34px}.appMeta p{max-width:36vw}.head h1{font-size:30px}}
</style>
</head>
<body data-no-common-nav="true">
<main class="store">
<header class="head"><h1>WebStore</h1><div class="headActions"><button class="circle" id="addBtn" aria-label="ゲーム追加">＋</button><button class="circle avatar" id="accountBtn" aria-label="アカウント">人</button></div></header>
<label class="search"><span>⌕</span><input id="search" type="search" placeholder="ゲーム、ジャンル、URLを検索"></label>
<section class="section"><div class="sectionHead"><div><h2>今日のおすすめ</h2><p>WebStore編集部のピックアップ</p></div></div><div class="feature"><div class="featureMain"><div class="eyebrow">注目のゲーム</div><h3>SHOO KING II</h3><p>宇宙船、武器、機体を強化して進むブラウザシューティング。</p><div class="featureIcon">🚀</div></div><div class="featureSide"><div class="eyebrow">自分のゲームを追加</div><h3>URLだけで登録</h3><p>公開されているHTMLゲームを自分のストアへ。</p><div class="featureIcon">🎮</div></div></div></section>
<section class="section"><div class="sectionHead"><div><h2>人気ゲーム</h2><p id="count">1本のゲーム</p></div><button id="directBtn">URLを開く</button></div><div class="appList" id="appList"></div><div class="empty" id="empty">見つかりませんでした。</div></section>
<section class="section"><div class="sectionHead"><div><h2>カテゴリ</h2><p>ジャンルから探す</p></div></div><div class="categories"><button class="cat" data-cat="シューティング"><span>🚀</span><strong>シューティング</strong><small>宇宙・銃撃・アクション</small></button><button class="cat" data-cat="RPG"><span>⚔️</span><strong>RPG</strong><small>冒険と育成</small></button><button class="cat" data-cat="パズル"><span>🧩</span><strong>パズル</strong><small>考えて解くゲーム</small></button><button class="cat" data-cat="アクション"><span>🏃</span><strong>アクション</strong><small>すぐ遊べるゲーム</small></button><button class="cat" data-cat="シミュレーション"><span>🏗️</span><strong>シミュレーション</strong><small>作る・運営する</small></button><button class="cat" data-cat=""><span>•••</span><strong>すべて表示</strong><small>登録済みゲーム一覧</small></button></div></section>
</main>
<nav class="bottom"><div class="bottomIn"><button class="tab active" data-tab="today">★<br>おすすめ</button><button class="tab" data-tab="games">▦<br>ゲーム</button><button class="tab" id="accountTab">●<br>アカウント</button></div></nav>
<div class="sheet" id="addSheet"><section class="panel"><button class="circle close" data-close="addSheet">×</button><h2>ゲームを追加</h2><form id="gameForm"><div class="field"><label>ゲーム名</label><input id="gameName" required maxlength="60"></div><div class="field"><label>ジャンル</label><select id="genre"><option>シューティング</option><option>アクション</option><option>RPG</option><option>パズル</option><option>シミュレーション</option><option>その他</option></select></div><div class="field"><label>HTMLゲームURL</label><input id="gameUrl" type="url" required placeholder="https://example.com/game.html"></div><div class="field"><label>説明</label><textarea id="description" maxlength="180"></textarea></div><button class="primary" type="submit">WebStoreに追加</button></form><p class="note">追加したゲームはこのブラウザ内に保存されます。登録にはWebStoreアカウントが必要です。</p></section></div>
<div class="sheet" id="accountSheet"><section class="panel"><button class="circle close" data-close="accountSheet">×</button><h2>アカウント</h2><div id="accountContent"></div></section></div>
<div class="sheet" id="moreSheet"><section class="panel"><button class="circle close" data-close="moreSheet">×</button><h2 id="moreTitle">ゲーム</h2><button class="primary" id="copyBtn">URLをコピー</button><button class="secondary" id="openBtn">新しいタブで開く</button><button class="danger" id="deleteBtn">WebStoreから削除</button></section></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';const GAME_KEY='sora_webstore_games_v2',ACCOUNT_KEY='sora_webstore_account_v1';const builtin={id:'shooking',name:'SHOO KING II',genre:'シューティング',description:'宇宙船、武器、機体を強化して進むブラウザシューティング。',url:new URL('./game?play=1&v=96&_pages=96&_stable=96',location.href).href,icon:'🚀',builtin:true};const $=id=>document.getElementById(id);let games=load(GAME_KEY,[]),selected=null;function load(k,d){try{const v=JSON.parse(localStorage.getItem(k)||'null');return v??d}catch{return d}}function save(){localStorage.setItem(GAME_KEY,JSON.stringify(games))}function account(){return load(ACCOUNT_KEY,null)}function validUrl(v){try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:''}catch{return''}}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),2200)}function openGame(url){const w=open(url,'_blank','noopener,noreferrer');if(!w)location.href=url}function all(){return [builtin,...games]}function row(g){const el=document.createElement('article');el.className='appRow';el.innerHTML='<div class="appIcon"></div><div class="appMeta"><h3></h3><p></p></div><button class="get">入手</button><button class="more">•••</button>';el.querySelector('.appIcon').textContent=g.icon||'🎮';el.querySelector('h3').textContent=g.name;el.querySelector('p').textContent=(g.genre||'ゲーム')+' · '+(g.description||'HTMLゲーム');el.querySelector('.get').onclick=()=>openGame(g.url);el.querySelector('.more').onclick=()=>showMore(g);return el}function render(filter=''){const q=$('search').value.trim().toLowerCase();const list=all().filter(g=>(!filter||g.genre===filter)&&[g.name,g.genre,g.description,g.url].join(' ').toLowerCase().includes(q));$('appList').replaceChildren(...list.map(row));$('empty').style.display=list.length?'none':'block';$('count').textContent=list.length+'本のゲーム'}function sheet(id,on=true){$(id).classList.toggle('open',on)}function requireAccount(){if(account())return true;renderAccount();sheet('accountSheet');toast('先に認証してください');return false}function renderAccount(){const a=account();const box=$('accountContent');box.innerHTML='';if(a){box.innerHTML='<div class="accountCard"><strong></strong><p></p></div><button class="secondary" id="logoutBtn">サインアウト</button><p class="note">この認証はこのブラウザ内だけで使うWebStore用ローカル認証です。</p>';box.querySelector('strong').textContent=a.name;box.querySelector('p').textContent='WebStore ID: '+a.id;$('logoutBtn').onclick=()=>{localStorage.removeItem(ACCOUNT_KEY);renderAccount();toast('サインアウトしました')}}else{box.innerHTML='<form id="authForm"><div class="field"><label>表示名</label><input id="authName" required maxlength="30"></div><div class="field"><label>4桁以上のパスコード</label><input id="authPass" type="password" required minlength="4"></div><button class="primary">認証して続ける</button></form><p class="note">サーバーへ送信しない簡易ローカル認証です。Google認証ではありません。</p>';$('authForm').onsubmit=e=>{e.preventDefault();const name=$('authName').value.trim(),pass=$('authPass').value;if(!name||pass.length<4)return;localStorage.setItem(ACCOUNT_KEY,JSON.stringify({name,id:'WS-'+Date.now().toString(36).toUpperCase()}));renderAccount();toast('認証しました')}}}function showMore(g){selected=g;$('moreTitle').textContent=g.name;$('deleteBtn').style.display=g.builtin?'none':'block';sheet('moreSheet')}$('addBtn').onclick=()=>{if(requireAccount())sheet('addSheet')};$('accountBtn').onclick=$('accountTab').onclick=()=>{renderAccount();sheet('accountSheet')};$('directBtn').onclick=()=>{const v=prompt('開くURL','https://');if(v===null)return;const u=validUrl(v);u?openGame(u):toast('正しいURLを入力してください')};$('search').oninput=()=>render();document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{render(b.dataset.cat);document.querySelector('.section:nth-of-type(2)').scrollIntoView({behavior:'smooth'})});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>sheet(b.dataset.close,false));document.querySelectorAll('.sheet').forEach(s=>s.addEventListener('click',e=>{if(e.target===s)sheet(s.id,false)}));$('gameForm').onsubmit=e=>{e.preventDefault();if(!requireAccount())return;const url=validUrl($('gameUrl').value);if(!url)return toast('正しいURLを入力してください');games.unshift({id:'g'+Date.now(),name:$('gameName').value.trim(),genre:$('genre').value,description:$('description').value.trim(),url,icon:'🎮'});save();e.target.reset();sheet('addSheet',false);render();toast('WebStoreに追加しました')};$('copyBtn').onclick=async()=>{if(!selected)return;try{await navigator.clipboard.writeText(selected.url);toast('URLをコピーしました')}catch{toast('コピーできませんでした')}};$('openBtn').onclick=()=>selected&&openGame(selected.url);$('deleteBtn').onclick=()=>{if(!selected||selected.builtin)return;if(!confirm('「'+selected.name+'」を削除しますか？'))return;games=games.filter(g=>g.id!==selected.id);save();sheet('moreSheet',false);render();toast('削除しました')};document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');if(t.dataset.tab==='today')scrollTo({top:0,behavior:'smooth'});if(t.dataset.tab==='games')document.querySelector('.section:nth-of-type(2)').scrollIntoView({behavior:'smooth'})});render();})();
</script>
</body>
</html>
