<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>WebStore</title>
<style>
:root{color-scheme:light;--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#d2d2d7;--blue:#0071e3;--soft:#e8f2ff;--red:#d70015;--shadow:0 14px 38px rgba(0,0,0,.09)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:0 0 calc(84px + env(safe-area-inset-bottom))}button,input,textarea,select{font:inherit}button{touch-action:manipulation}#shookingCommonNav,#shookingBreadcrumb,#shookingGameExit{display:none!important}.store{width:min(1080px,calc(100% - 28px));margin:auto}.pageHeader{display:flex;align-items:flex-end;gap:16px;padding:26px 0 16px}.date{margin:0 0 3px;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}.pageHeader h1{margin:0;font-size:clamp(36px,7vw,54px);line-height:.95;letter-spacing:-.055em}.profile{margin-left:auto;width:46px;height:46px;border:0;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#58a9ff,#6558ea);color:#fff;font-weight:900;font-size:17px;cursor:pointer;box-shadow:0 6px 20px rgba(0,113,227,.25)}.view{display:none}.view.active{display:block}.section{padding:22px 0;border-top:1px solid var(--line)}.section.first{padding-top:0;border-top:0}.sectionHead{display:flex;align-items:flex-end;gap:14px;margin-bottom:13px}.sectionHead h2{margin:0;font-size:25px;letter-spacing:-.035em}.sectionHead p{margin:0;color:var(--muted);font-size:13px}.linkBtn{margin-left:auto;border:0;background:none;color:var(--blue);font-weight:800;cursor:pointer}.featureGrid{display:grid;grid-template-columns:1.35fr .65fr;gap:14px}.feature{min-height:300px;padding:25px;border:0;border-radius:24px;position:relative;overflow:hidden;text-align:left;color:#fff;cursor:pointer;box-shadow:var(--shadow)}.feature.main{background:linear-gradient(145deg,#091f39,#1262ad 56%,#332d78)}.feature.add{background:linear-gradient(145deg,#4a1b61,#a54191 58%,#f07e76)}.feature:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 82% 17%,rgba(255,255,255,.28),transparent 27%);pointer-events:none}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.09em;opacity:.8}.feature h2{position:relative;z-index:1;margin:12px 0 8px;max-width:620px;font-size:clamp(30px,5vw,46px);line-height:1;letter-spacing:-.045em}.feature p{position:relative;z-index:1;max-width:530px;margin:0;line-height:1.55;opacity:.84}.featureIcon{position:absolute;right:24px;bottom:18px;font-size:92px;filter:drop-shadow(0 14px 20px rgba(0,0,0,.35))}.appList{overflow:hidden;border-radius:20px;background:var(--card);box-shadow:0 1px 0 rgba(0,0,0,.02)}.appRow{display:grid;grid-template-columns:74px minmax(0,1fr) auto auto;align-items:center;gap:14px;margin:0 18px;padding:15px 0;border-bottom:1px solid #e5e5ea}.appRow:last-child{border-bottom:0}.appIcon{width:74px;height:74px;display:grid;place-items:center;border-radius:17px;background:linear-gradient(145deg,#153e6c,#2e82c7 56%,#6151d8);font-size:39px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}.appMeta{min-width:0}.appMeta h3{margin:0 0 4px;font-size:17px}.appMeta p{margin:0;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.get{min-width:76px;border:0;border-radius:999px;padding:8px 16px;background:var(--soft);color:var(--blue);font-weight:900;cursor:pointer}.more{width:38px;height:38px;border:0;border-radius:50%;background:#ececf1;color:#55555a;font-weight:900;cursor:pointer}.categoryGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.category{border:0;border-radius:18px;padding:18px;background:var(--card);text-align:left;cursor:pointer}.category span{font-size:30px}.category strong{display:block;margin:8px 0 2px}.category small{color:var(--muted)}.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 14px;scrollbar-width:none}.chip{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:8px 13px;background:#fff;color:#3a3a3c;font-weight:800;cursor:pointer}.chip.active{border-color:var(--blue);background:var(--blue);color:#fff}.searchBox{position:relative;margin-bottom:16px}.searchBox span{position:absolute;left:15px;top:12px;color:#77777c;font-size:19px}.searchBox input{width:100%;height:46px;border:0;border-radius:13px;padding:0 14px 0 42px;background:#e4e4e9;outline:none;font-size:16px}.libraryHero{display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px;padding:20px;border-radius:20px;background:var(--card)}.libraryHero h2{margin:0 0 5px}.libraryHero p{margin:0;color:var(--muted);line-height:1.5}.primary,.secondary,.danger{border:0;border-radius:12px;padding:11px 15px;font-weight:900;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#ececf1;color:#25252a}.danger{background:#ffe9ec;color:var(--red)}.empty{padding:34px;border-radius:18px;background:var(--card);color:var(--muted);text-align:center}.bottomNav{position:fixed;left:0;right:0;bottom:0;z-index:30;border-top:1px solid #d9d9de;background:rgba(247,247,249,.9);backdrop-filter:blur(22px);padding-bottom:env(safe-area-inset-bottom)}.bottomInner{width:min(580px,100%);height:70px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.tab{border:0;background:none;color:#77777c;font-size:11px;font-weight:800;cursor:pointer}.tab b{display:block;margin-bottom:2px;font-size:21px;line-height:1}.tab.active{color:var(--blue)}.sheet{position:fixed;inset:0;z-index:60;display:none;place-items:end center;background:rgba(0,0,0,.38)}.sheet.open{display:grid}.panel{width:min(580px,100%);max-height:90vh;overflow:auto;border-radius:25px 25px 0 0;padding:22px;background:#fff;box-shadow:0 -16px 45px rgba(0,0,0,.16)}.panelHead{display:flex;align-items:center;margin-bottom:15px}.panelHead h2{margin:0;font-size:25px}.close{margin-left:auto;width:38px;height:38px;border:0;border-radius:50%;background:#ececf1;font-weight:900;cursor:pointer}.field{margin:12px 0}.field label{display:block;margin-bottom:6px;font-size:13px;font-weight:800}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;outline:none}.field textarea{min-height:82px;resize:vertical}.wide{width:100%;margin-top:9px}.accountCard{padding:17px;border-radius:18px;background:#f2f2f7}.accountLine{display:flex;align-items:center;gap:12px}.accountAvatar{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#58a9ff,#6558ea);color:#fff;font-size:21px;font-weight:900}.accountCard strong{display:block;font-size:20px}.accountCard small{color:var(--muted)}.status{display:inline-flex;align-items:center;gap:6px;margin-top:9px;color:#198754;font-size:12px;font-weight:800}.status:before{content:"";width:8px;height:8px;border-radius:50%;background:#2ac26f}.note{color:var(--muted);font-size:12px;line-height:1.6}.toast{position:fixed;left:50%;bottom:92px;z-index:100;transform:translateX(-50%) translateY(18px);opacity:0;padding:10px 15px;border-radius:999px;background:#1d1d1f;color:#fff;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:760px){.featureGrid{grid-template-columns:1fr}.feature.add{min-height:220px}.categoryGrid{grid-template-columns:1fr 1fr}.appRow{grid-template-columns:62px minmax(0,1fr) auto auto;gap:10px;margin:0 14px}.appIcon{width:62px;height:62px;border-radius:14px;font-size:32px}.appMeta p{max-width:36vw}.libraryHero{grid-template-columns:1fr}.libraryHero .primary{width:100%}}
</style>
</head>
<body data-no-common-nav="true">
<main class="store">
<header class="pageHeader"><div><p class="date" id="dateLabel"></p><h1 id="pageTitle">おすすめ</h1></div><button class="profile" id="profileBtn" type="button" aria-label="アカウント">人</button></header>
<section class="view active" id="todayView">
<div class="section first"><div class="featureGrid"><button class="feature main" id="featuredGame" type="button"><span class="eyebrow">WEBSTORE EXCLUSIVE</span><h2>宇宙へ出撃。<br>SHOO KING II</h2><p>武器、機体、ステージを攻略するブラウザシューティング。</p><span class="featureIcon">🚀</span></button><button class="feature add" id="featureAdd" type="button"><span class="eyebrow">YOUR LIBRARY</span><h2>ゲームURLを追加</h2><p>公開されているHTMLゲームを、自分のライブラリへ。</p><span class="featureIcon">＋</span></button></div></div>
<div class="section"><div class="sectionHead"><div><h2>注目のゲーム</h2><p>すぐ遊べるHTMLゲーム</p></div><button class="linkBtn" data-go="games" type="button">すべて見る</button></div><div class="appList" id="todayList"></div></div>
<div class="section"><div class="sectionHead"><div><h2>カテゴリ</h2><p>ジャンルから探す</p></div></div><div class="categoryGrid"><button class="category" data-category="シューティング"><span>🚀</span><strong>シューティング</strong><small>宇宙・銃撃・アクション</small></button><button class="category" data-category="RPG"><span>⚔️</span><strong>RPG</strong><small>冒険と育成</small></button><button class="category" data-category="パズル"><span>🧩</span><strong>パズル</strong><small>考えて解く</small></button><button class="category" data-category="アクション"><span>🏃</span><strong>アクション</strong><small>すぐ遊べる</small></button><button class="category" data-category="シミュレーション"><span>🏗️</span><strong>シミュレーション</strong><small>作る・運営する</small></button><button class="category" data-category=""><span>•••</span><strong>すべて</strong><small>全ゲーム一覧</small></button></div></div>
</section>
<section class="view" id="gamesView"><div class="section first"><div class="chips" id="chips"><button class="chip active" data-filter="">すべて</button><button class="chip" data-filter="シューティング">シューティング</button><button class="chip" data-filter="アクション">アクション</button><button class="chip" data-filter="RPG">RPG</button><button class="chip" data-filter="パズル">パズル</button><button class="chip" data-filter="シミュレーション">シミュレーション</button></div><div class="appList" id="gamesList"></div></div></section>
<section class="view" id="libraryView"><div class="section first"><div class="libraryHero"><div><h2>マイライブラリ</h2><p id="libraryMessage">認証すると、自分のHTMLゲームURLを登録できます。</p></div><button class="primary" id="libraryAdd" type="button">ゲームを追加</button></div></div><div class="section"><div class="sectionHead"><div><h2>登録したゲーム</h2><p>このアカウントのライブラリ</p></div></div><div id="libraryContent"></div></div><div class="section"><div class="sectionHead"><div><h2>最近使った項目</h2><p>最近開いたゲーム</p></div></div><div id="recentContent"></div></div></section>
<section class="view" id="searchView"><div class="section first"><label class="searchBox"><span>⌕</span><input id="searchInput" type="search" placeholder="ゲーム、ジャンル、URLを検索"></label><button class="secondary wide" id="directOpen" type="button">URLを直接入力して開く</button></div><div class="section"><div class="sectionHead"><div><h2>検索結果</h2><p id="searchCount">すべてのゲーム</p></div></div><div id="searchContent"></div></div></section>
</main>
<nav class="bottomNav" aria-label="WebStoreメニュー"><div class="bottomInner"><button class="tab active" data-tab="today" type="button"><b>★</b>おすすめ</button><button class="tab" data-tab="games" type="button"><b>▦</b>ゲーム</button><button class="tab" data-tab="library" type="button"><b>▣</b>ライブラリ</button><button class="tab" data-tab="search" type="button"><b>⌕</b>検索</button></div></nav>
<div class="sheet" id="accountSheet"><section class="panel"><div class="panelHead"><h2>アカウント</h2><button class="close" data-close="accountSheet" type="button">×</button></div><div id="accountContent"></div></section></div>
<div class="sheet" id="addSheet"><section class="panel"><div class="panelHead"><h2>ゲームを追加</h2><button class="close" data-close="addSheet" type="button">×</button></div><form id="addForm"><div class="field"><label for="gameName">ゲーム名</label><input id="gameName" maxlength="60" required></div><div class="field"><label for="gameGenre">ジャンル</label><select id="gameGenre"><option>シューティング</option><option>アクション</option><option>RPG</option><option>パズル</option><option>シミュレーション</option><option>その他</option></select></div><div class="field"><label for="gameUrl">HTMLゲームURL</label><input id="gameUrl" type="url" inputmode="url" placeholder="https://example.com/game.html" required></div><div class="field"><label for="gameDescription">説明</label><textarea id="gameDescription" maxlength="180"></textarea></div><button class="primary wide" type="submit">ライブラリへ追加</button></form><p class="note">追加したURLは、現在ログイン中のアカウント用としてこのブラウザに保存されます。</p></section></div>
<div class="sheet" id="moreSheet"><section class="panel"><div class="panelHead"><h2 id="moreTitle">ゲーム</h2><button class="close" data-close="moreSheet" type="button">×</button></div><button class="primary wide" id="moreOpen" type="button">開く</button><button class="secondary wide" id="moreCopy" type="button">URLをコピー</button><button class="danger wide" id="moreDelete" type="button">ライブラリから削除</button></section></div>
<div class="toast" id="toast" role="status"></div>
<script>
(()=>{'use strict';
const CURRENT_KEY='shooking2_current_account',LEGACY_KEY='sora_webstore_games_v2',PREFIX='sora_webstore_games_v3_',RECENT_PREFIX='sora_webstore_recent_v1_';
const builtin={id:'shooking',name:'SHOO KING II',genre:'シューティング',description:'宇宙船、武器、機体を強化して進むブラウザシューティング。',url:new URL('./game?play=1&v=96&_pages=96&_stable=96',location.href).href,icon:'🚀',builtin:true};
const $=id=>document.getElementById(id);let selected=null,currentFilter='';
function read(key,fallback){try{const v=JSON.parse(localStorage.getItem(key)||'null');return v??fallback}catch{return fallback}}
function account(){return read(CURRENT_KEY,null)}
function accountId(){const a=account();return a?String(a.uid||a.email||a.accountName||'player').replace(/[^a-z0-9_-]/gi,'_'):'guest'}
function gameKey(){return PREFIX+accountId()}
function recentKey(){return RECENT_PREFIX+accountId()}
function customGames(){if(!account())return[];let list=read(gameKey(),null);if(!Array.isArray(list)){const legacy=read(LEGACY_KEY,[]);list=Array.isArray(legacy)?legacy:[];localStorage.setItem(gameKey(),JSON.stringify(list))}return list}
function saveGames(list){localStorage.setItem(gameKey(),JSON.stringify(list))}
function allGames(){return[builtin,...customGames()]}
function validUrl(value){try{const u=new URL(String(value).trim());return/^https?:$/.test(u.protocol)?u.href:''}catch{return''}}
function flash(text){$('toast').textContent=text;$('toast').classList.add('show');clearTimeout(flash.t);flash.t=setTimeout(()=>$('toast').classList.remove('show'),2300)}
function showSheet(id){$(id).classList.add('open')}
function hideSheet(id){$(id).classList.remove('open')}
function initial(){const a=account(),name=a?.accountName||a?.name||a?.email||'人';return String(name).trim().charAt(0).toUpperCase()||'人'}
function track(game){if(!account())return;let ids=read(recentKey(),[]);ids=[game.id,...ids.filter(id=>id!==game.id)].slice(0,6);localStorage.setItem(recentKey(),JSON.stringify(ids))}
function openGame(game){track(game);renderRecent();const w=window.open(game.url,'_blank','noopener,noreferrer');if(!w)location.href=game.url}
function appRow(game){const row=document.createElement('article');row.className='appRow';const icon=document.createElement('div');icon.className='appIcon';icon.textContent=game.icon||'🎮';const meta=document.createElement('div');meta.className='appMeta';const title=document.createElement('h3');title.textContent=game.name;const desc=document.createElement('p');desc.textContent=(game.genre||'ゲーム')+' · '+(game.description||'HTMLゲーム');meta.append(title,desc);const open=document.createElement('button');open.className='get';open.type='button';open.textContent='開く';open.onclick=()=>openGame(game);const more=document.createElement('button');more.className='more';more.type='button';more.textContent='•••';more.setAttribute('aria-label','その他');more.onclick=()=>showMore(game);row.append(icon,meta,open,more);return row}
function listInto(target,list,emptyText='ゲームがありません。'){const el=typeof target==='string'?$(target):target;if(!list.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=emptyText;el.replaceChildren(empty);return}const box=document.createElement('div');box.className='appList';list.forEach(g=>box.appendChild(appRow(g)));el.replaceChildren(box)}
function renderToday(){listInto('todayList',allGames().slice(0,5))}
function renderGames(){const list=allGames().filter(g=>!currentFilter||g.genre===currentFilter);listInto('gamesList',list)}
function renderLibrary(){const a=account();$('libraryMessage').textContent=a?'認証済み。追加したゲームはこのアカウント用に保存されます。':'認証すると、自分のHTMLゲームURLを登録できます。';listInto('libraryContent',customGames(),a?'まだゲームが登録されていません。':'アカウント認証が必要です。');renderRecent()}
function renderRecent(){const ids=read(recentKey(),[]),map=new Map(allGames().map(g=>[g.id,g]));listInto('recentContent',ids.map(id=>map.get(id)).filter(Boolean),'最近開いたゲームはありません。')}
function renderSearch(){const q=$('searchInput').value.trim().toLowerCase();const list=allGames().filter(g=>[g.name,g.genre,g.description,g.url].join(' ').toLowerCase().includes(q));$('searchCount').textContent=q?list.length+'件':'すべてのゲーム';listInto('searchContent',list,'検索結果がありません。')}
function renderAccount(){const box=$('accountContent'),a=account();$('profileBtn').textContent=initial();box.innerHTML='';if(a){const card=document.createElement('div');card.className='accountCard';const line=document.createElement('div');line.className='accountLine';const avatar=document.createElement('div');avatar.className='accountAvatar';avatar.textContent=initial();const text=document.createElement('div');const strong=document.createElement('strong');strong.textContent=a.accountName||a.name||a.email||'Player';const small=document.createElement('small');small.textContent=a.email||a.provider||'SHOO KING II Account';text.append(strong,small);line.append(avatar,text);const status=document.createElement('div');status.className='status';status.textContent='認証済み';card.append(line,status);const settings=document.createElement('button');settings.className='secondary wide';settings.textContent='ゲーム側のアカウント設定を開く';settings.onclick=()=>location.href=builtin.url;const refresh=document.createElement('button');refresh.className='secondary wide';refresh.textContent='認証状態を更新';refresh.onclick=()=>{renderAll();renderAccount();flash('認証状態を更新しました')};box.append(card,settings,refresh)}else{const card=document.createElement('div');card.className='accountCard';card.innerHTML='<strong>WebStoreにサインイン</strong><p class="note">SHOO KING IIと同じアカウントを使います。認証後、このページへ戻るとゲームURLを登録できます。</p>';const signIn=document.createElement('button');signIn.className='primary wide';signIn.textContent='SHOO KING IIでログイン';signIn.onclick=()=>location.href=builtin.url;const refresh=document.createElement('button');refresh.className='secondary wide';refresh.textContent='ログイン状態を確認';refresh.onclick=()=>{renderAll();renderAccount();flash(account()?'認証を確認しました':'まだログインしていません')};box.append(card,signIn,refresh)}}
function requireAccount(){if(account())return true;renderAccount();showSheet('accountSheet');flash('先にアカウント認証してください');return false}
function openAdd(){if(!requireAccount())return;showSheet('addSheet');setTimeout(()=>$('gameName').focus(),50)}
function showMore(game){selected=game;$('moreTitle').textContent=game.name;$('moreDelete').style.display=game.builtin?'none':'block';showSheet('moreSheet')}
function switchTab(tab){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$(tab+'View').classList.add('active');$('pageTitle').textContent={today:'おすすめ',games:'ゲーム',library:'ライブラリ',search:'検索'}[tab];if(tab==='library')renderLibrary();if(tab==='search'){renderSearch();setTimeout(()=>$('searchInput').focus(),50)}window.scrollTo({top:0,behavior:'smooth'})}
function renderAll(){renderToday();renderGames();renderLibrary();renderSearch();renderAccount()}
$('dateLabel').textContent=new Intl.DateTimeFormat('ja-JP',{month:'long',day:'numeric',weekday:'long'}).format(new Date());
$('profileBtn').onclick=()=>{renderAccount();showSheet('accountSheet')};$('featuredGame').onclick=()=>openGame(builtin);$('featureAdd').onclick=openAdd;$('libraryAdd').onclick=openAdd;
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>hideSheet(b.dataset.close));document.querySelectorAll('.sheet').forEach(s=>s.addEventListener('click',e=>{if(e.target===s)hideSheet(s.id)}));
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>switchTab(b.dataset.go));
document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{currentFilter=b.dataset.category;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.filter===currentFilter));renderGames();switchTab('games')});document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{currentFilter=c.dataset.filter;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===c));renderGames()});
$('searchInput').oninput=renderSearch;$('directOpen').onclick=()=>{const value=prompt('開きたいHTMLゲームURLを入力してください。','https://');if(value===null)return;const url=validUrl(value);if(!url){flash('http:// または https:// のURLを入力してください');return}openGame({id:'direct-'+Date.now(),name:'Direct URL',url,genre:'その他'})};
$('addForm').onsubmit=e=>{e.preventDefault();if(!requireAccount())return;const name=$('gameName').value.trim(),url=validUrl($('gameUrl').value);if(!name||!url){flash('ゲーム名と正しいURLを入力してください');return}const list=customGames();list.unshift({id:'game-'+Date.now(),name,genre:$('gameGenre').value,description:$('gameDescription').value.trim(),url,icon:'🎮'});saveGames(list);e.target.reset();hideSheet('addSheet');renderAll();switchTab('library');flash('ライブラリへ追加しました')};
$('moreOpen').onclick=()=>{if(selected)openGame(selected)};$('moreCopy').onclick=async()=>{if(!selected)return;try{await navigator.clipboard.writeText(selected.url);flash('URLをコピーしました')}catch{flash('コピーできませんでした')}};$('moreDelete').onclick=()=>{if(!selected||selected.builtin)return;if(!confirm('「'+selected.name+'」を削除しますか？'))return;saveGames(customGames().filter(g=>g.id!==selected.id));hideSheet('moreSheet');renderAll();flash('ライブラリから削除しました')};
window.addEventListener('storage',e=>{if(e.key===CURRENT_KEY)renderAll()});window.addEventListener('pageshow',renderAll);renderAll();
})();
</script>
</body>
</html>
