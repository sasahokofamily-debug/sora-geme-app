<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>WebStore | HTML Games</title>
<style>
:root{color-scheme:dark;--bg:#070b16;--panel:#11182a;--panel2:#17213a;--line:#2a3858;--text:#f4f7ff;--muted:#9cabc7;--blue:#4f8cff;--cyan:#34d8ff;--green:#38d996;--red:#ff667a;--shadow:0 20px 60px rgba(0,0,0,.35)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% -10%,#18396d 0,transparent 35%),radial-gradient(circle at 100% 20%,#17335b 0,transparent 30%),var(--bg);color:var(--text);font-family:Inter,"Segoe UI",system-ui,sans-serif}.shell{width:min(1180px,calc(100% - 28px));margin:auto}.topbar{position:sticky;top:0;z-index:30;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(7,11,22,.85);backdrop-filter:blur(18px)}.topbarInner{min-height:68px;display:flex;align-items:center;gap:14px}.logo{display:flex;align-items:center;gap:11px;font-size:20px;font-weight:900;letter-spacing:.02em}.logoMark{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(145deg,var(--cyan),var(--blue));color:#041020;box-shadow:0 8px 28px rgba(52,216,255,.28)}.topActions{margin-left:auto;display:flex;gap:8px}.button,.iconButton{border:1px solid var(--line);background:#18233b;color:var(--text);font:inherit;font-weight:800;border-radius:12px;cursor:pointer;transition:.18s transform,.18s border-color,.18s background}.button{min-height:44px;padding:10px 16px}.button:hover,.iconButton:hover{transform:translateY(-1px);border-color:#5a78ad}.button.primary{border-color:#4d91ff;background:linear-gradient(145deg,#2474ff,#6958ff)}.button.green{border-color:#2eae7e;background:#147653}.button.danger{border-color:#703447;background:#3a1a25;color:#ffc2cb}.iconButton{width:42px;height:42px}.hero{padding:54px 0 28px}.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid rgba(79,140,255,.42);border-radius:999px;background:rgba(79,140,255,.1);color:#9ec1ff;font-size:12px;font-weight:900;letter-spacing:.08em}.hero h1{margin:17px 0 10px;font-size:clamp(40px,8vw,76px);line-height:.98;letter-spacing:-.045em}.hero p{max-width:710px;margin:0;color:var(--muted);font-size:clamp(15px,2vw,18px);line-height:1.8}.toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;margin:22px 0}.search{position:relative}.search input{width:100%;height:50px;padding:0 16px 0 47px;border:1px solid var(--line);border-radius:15px;background:rgba(17,24,42,.9);color:var(--text);font:inherit;outline:none}.search input:focus{border-color:#5f9cff;box-shadow:0 0 0 4px rgba(79,140,255,.12)}.search span{position:absolute;left:17px;top:13px;font-size:20px}.count{display:flex;align-items:center;padding:0 15px;border:1px solid var(--line);border-radius:15px;background:rgba(17,24,42,.72);color:var(--muted);font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding-bottom:48px}.card{overflow:hidden;border:1px solid var(--line);border-radius:20px;background:linear-gradient(160deg,rgba(24,34,59,.98),rgba(13,19,34,.98));box-shadow:var(--shadow);transition:.2s transform,.2s border-color}.card:hover{transform:translateY(-4px);border-color:#526d9e}.cover{position:relative;height:178px;display:grid;place-items:center;overflow:hidden;background:linear-gradient(145deg,#0b2948,#143f74 55%,#332b73)}.cover::before{content:"";position:absolute;inset:-30%;background:radial-gradient(circle,#65ddff55 0 3%,transparent 4%),radial-gradient(circle at 70% 30%,#fff8 0 1px,transparent 2px);background-size:75px 75px,43px 43px;transform:rotate(12deg)}.coverIcon{position:relative;font-size:66px;filter:drop-shadow(0 12px 20px rgba(0,0,0,.38))}.badge{position:absolute;top:12px;left:12px;padding:5px 9px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(0,0,0,.38);backdrop-filter:blur(8px);font-size:11px;font-weight:900}.cardBody{padding:18px}.card h2{margin:0 0 7px;font-size:22px}.desc{min-height:48px;margin:0;color:var(--muted);font-size:14px;line-height:1.65}.url{margin:13px 0;padding:9px 10px;border-radius:10px;background:#090e1b;color:#8ea2c6;font:12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cardActions{display:grid;grid-template-columns:1fr auto;gap:9px}.empty{display:none;grid-column:1/-1;padding:46px 18px;border:1px dashed #344563;border-radius:18px;color:var(--muted);text-align:center}.editor{display:none;margin:0 0 26px;padding:22px;border:1px solid var(--line);border-radius:20px;background:rgba(17,24,42,.96);box-shadow:var(--shadow)}.editor.open{display:block}.editorHead{display:flex;align-items:center;gap:12px;margin-bottom:16px}.editorHead h2{margin:0}.editorHead button{margin-left:auto}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field.full{grid-column:1/-1}.field label{display:block;margin:0 0 6px;color:#b9c7df;font-size:13px;font-weight:800}.field input,.field textarea,.field select{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#0a1020;color:var(--text);font:inherit;outline:none}.field textarea{min-height:88px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#5f9cff}.formActions{display:flex;justify-content:flex-end;gap:9px;margin-top:15px}.notice{display:none;margin:0 0 18px;padding:12px 14px;border:1px solid #286f5b;border-radius:12px;background:#0c352b;color:#bdfbe5}.notice.error{border-color:#7b3344;background:#3a1720;color:#ffc5ce}.notice.show{display:block}.footer{padding:24px 0 36px;border-top:1px solid rgba(255,255,255,.08);color:#7f90ae;font-size:12px;text-align:center}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.shell{width:min(100% - 20px,1180px)}.topbarInner{min-height:60px}.logo{font-size:17px}.topActions .button span{display:none}.hero{padding-top:36px}.toolbar{grid-template-columns:1fr}.count{min-height:42px;justify-content:center}.grid{grid-template-columns:1fr}.cover{height:160px}.formGrid{grid-template-columns:1fr}.field.full{grid-column:auto}.formActions{display:grid;grid-template-columns:1fr 1fr}.formActions .button{width:100%}}
</style>
</head>
<body>
<header class="topbar"><div class="shell topbarInner"><div class="logo"><span class="logoMark">W</span><span>WebStore</span></div><div class="topActions"><button class="button" id="quickOpenButton" type="button">🔗 <span>URLを直接開く</span></button><button class="button primary" id="addButton" type="button">＋ <span>ゲームを追加</span></button></div></div></header>
<main class="shell">
<section class="hero"><span class="eyebrow">HTML GAME LAUNCHER</span><h1>遊びたいゲームへ、<br>すぐアクセス。</h1><p>HTMLゲームのURLを登録して、自分専用のゲームストアを作れます。追加したゲームはこの端末のブラウザに保存されます。</p></section>
<div id="notice" class="notice" role="status"></div>
<section id="editor" class="editor" aria-label="ゲーム登録フォーム">
<div class="editorHead"><h2>ゲームを追加</h2><button class="iconButton" id="closeEditor" type="button" aria-label="閉じる">×</button></div>
<form id="gameForm">
<div class="formGrid">
<div class="field"><label for="gameName">ゲーム名</label><input id="gameName" maxlength="60" placeholder="例：宇宙シューティング" required></div>
<div class="field"><label for="gameCategory">ジャンル</label><select id="gameCategory"><option>シューティング</option><option>アクション</option><option>RPG</option><option>パズル</option><option>シミュレーション</option><option>その他</option></select></div>
<div class="field full"><label for="gameUrl">HTMLゲームのURL</label><input id="gameUrl" type="url" inputmode="url" placeholder="https://example.com/game.html" required></div>
<div class="field full"><label for="gameDescription">説明</label><textarea id="gameDescription" maxlength="180" placeholder="ゲームの内容を短く入力"></textarea></div>
</div>
<div class="formActions"><button class="button" id="cancelButton" type="button">キャンセル</button><button class="button green" type="submit">WebStoreへ登録</button></div>
</form>
</section>
<section class="toolbar"><label class="search"><span>⌕</span><input id="searchInput" type="search" placeholder="ゲーム名・ジャンル・URLを検索" autocomplete="off"></label><div class="count" id="gameCount">0 GAME</div></section>
<section class="grid" id="gameGrid"><div class="empty" id="emptyState">該当するゲームがありません。</div></section>
</main>
<footer class="footer">WebStore stores custom game links only in this browser.</footer>
<script>
(()=>{
'use strict';
const STORAGE_KEY='sora_webstore_games_v1';
const BUILTIN=[{id:'builtin-shooking',name:'SHOO KING II',category:'シューティング',description:'宇宙船を操作してステージ、武器、機体を攻略するブラウザシューティング。',url:new URL('./game?play=1&v=94&_pages=94&_stable=94',location.href).href,icon:'🚀',builtin:true}];
const grid=document.getElementById('gameGrid');
const empty=document.getElementById('emptyState');
const search=document.getElementById('searchInput');
const count=document.getElementById('gameCount');
const editor=document.getElementById('editor');
const form=document.getElementById('gameForm');
const notice=document.getElementById('notice');
let custom=load();

function load(){try{const value=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');return Array.isArray(value)?value:[]}catch{return []}}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(custom))}catch{showNotice('端末へ保存できませんでした。ブラウザの保存設定を確認してください。',true)}}
function safeUrl(value){try{const url=new URL(String(value).trim());if(url.protocol!=='https:'&&url.protocol!=='http:')throw new Error();return url.href}catch{return ''}}
function showNotice(message,error=false){notice.textContent=message;notice.className='notice show'+(error?' error':'');clearTimeout(showNotice.timer);showNotice.timer=setTimeout(()=>notice.className='notice',3800)}
function openUrl(url){const opened=window.open(url,'_blank','noopener,noreferrer');if(!opened)location.href=url}
function card(game){
 const article=document.createElement('article');article.className='card';
 const cover=document.createElement('div');cover.className='cover';
 const badge=document.createElement('span');badge.className='badge';badge.textContent=game.builtin?'OFFICIAL':game.category||'GAME';
 const icon=document.createElement('div');icon.className='coverIcon';icon.textContent=game.icon||'🎮';cover.append(badge,icon);
 const body=document.createElement('div');body.className='cardBody';
 const title=document.createElement('h2');title.textContent=game.name;
 const desc=document.createElement('p');desc.className='desc';desc.textContent=game.description||'HTMLゲームへのリンクです。';
 const url=document.createElement('div');url.className='url';url.textContent=game.url;url.title=game.url;
 const actions=document.createElement('div');actions.className='cardActions';
 const play=document.createElement('button');play.className='button primary';play.type='button';play.textContent='プレイする';play.addEventListener('click',()=>openUrl(game.url));
 actions.appendChild(play);
 if(game.builtin){const copy=document.createElement('button');copy.className='iconButton';copy.type='button';copy.title='URLをコピー';copy.textContent='⧉';copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(game.url);showNotice('URLをコピーしました。')}catch{showNotice('URLをコピーできませんでした。',true)}});actions.appendChild(copy)}
 else{const remove=document.createElement('button');remove.className='button danger';remove.type='button';remove.textContent='削除';remove.addEventListener('click',()=>{if(!confirm('「'+game.name+'」をWebStoreから削除しますか？'))return;custom=custom.filter(item=>item.id!==game.id);save();render();showNotice('ゲームを削除しました。')});actions.appendChild(remove)}
 body.append(title,desc,url,actions);article.append(cover,body);return article;
}
function render(){
 const q=search.value.trim().toLowerCase();const games=[...BUILTIN,...custom];const filtered=games.filter(game=>[game.name,game.category,game.description,game.url].join(' ').toLowerCase().includes(q));
 grid.querySelectorAll('.card').forEach(node=>node.remove());filtered.forEach(game=>grid.insertBefore(card(game),empty));empty.style.display=filtered.length?'none':'block';count.textContent=filtered.length+' GAME'+(filtered.length===1?'':'S');
}
function showEditor(){editor.classList.add('open');document.getElementById('gameName').focus();editor.scrollIntoView({behavior:'smooth',block:'start'})}
function hideEditor(){editor.classList.remove('open');form.reset()}
document.getElementById('addButton').addEventListener('click',showEditor);
document.getElementById('closeEditor').addEventListener('click',hideEditor);
document.getElementById('cancelButton').addEventListener('click',hideEditor);
document.getElementById('quickOpenButton').addEventListener('click',()=>{const value=prompt('開きたいHTMLゲームのURLを入力してください。','https://');if(value===null)return;const url=safeUrl(value);if(!url){showNotice('http:// または https:// から始まるURLを入力してください。',true);return}openUrl(url)});
search.addEventListener('input',render);
form.addEventListener('submit',event=>{event.preventDefault();const name=document.getElementById('gameName').value.trim();const category=document.getElementById('gameCategory').value;const url=safeUrl(document.getElementById('gameUrl').value);const description=document.getElementById('gameDescription').value.trim();if(!name){showNotice('ゲーム名を入力してください。',true);return}if(!url){showNotice('正しいhttp/httpsのURLを入力してください。',true);return}custom.unshift({id:'game-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),name,category,url,description,icon:'🎮',builtin:false});save();hideEditor();render();showNotice('WebStoreへ登録しました。')});
render();
})();
</script>
</body>
</html>
